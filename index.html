/* ================================================================
   8b. TRAINING — levels, adaptation, spaced return, the avoidance mirror, drills, placement
   ================================================================ */
const DAYS14 = 14 * DAY;
const lv = k => state.levels[k] || (state.levels[k] = { start:1, cur:1, override:null });
const attemptsOf = k => state.attempts.filter(a => a.pattern === k);
function lastSeen(item){ const a = state.attempts.filter(x => x.item === item).map(x => x.at).sort(); return a.length ? a[a.length-1] : null; }
/* A first attempt is the first submission on an item; an item last seen 14 or more days ago counts as fresh. Everything else is a retry. */
function isFirst(item){ const l = lastSeen(item); return !l || (now() - new Date(l)) >= DAYS14; }
function isPassed(k){
  const w = windowFor(k);
  if(w.n < 4 || w.right < 3) return false;
  return w.all.slice(-4).some(x => x.correct && x.level >= 2);
}
function needsRevisit(k){
  if(!isPassed(k)) return false;
  const w = windowFor(k);
  return (now() - new Date(w.all[w.all.length-1].at)) >= DAYS14;
}
/* Adaptation changes the road, never the pass criteria. Two or more misses in the window: easier, hints shown. One miss: hold.
   No misses across a full window of four: harder (if a harder level exists), hints withdrawn. Fewer than 2 attempts: stay at the start level. */
function hintMode(k){
  const w = windowFor(k);
  if(w.all.length < 2) return 'tap';
  const wrong = w.n - w.right;
  if(wrong >= 2) return 'shown';
  if(w.n === 4 && wrong === 0) return 'withdrawn';
  return 'tap';
}
function updateLevel(k){
  const w = windowFor(k), L = lv(k);
  if(w.all.length < 2) return;
  const wrong = w.n - w.right;
  if(wrong >= 2) L.cur = Math.max(1, L.cur - 1);
  else if(w.n === 4 && wrong === 0) L.cur = Math.min(3, L.cur + 1);
}
const HINT_TEXT = { shown:'Hints are shown', tap:'Hints are available on tap', withdrawn:'Hints are withdrawn' };
const levelLine = k => 'Level '+lv(k).cur+'. '+HINT_TEXT[hintMode(k)]+'.';

function pickNext(filter){
  const sid = sessionId();
  const inSession = state.attempts.filter(a => a.kind === 'drill' && a.sessionId === sid).length;
  const passed = PKEYS.filter(isPassed);
  const lastAt = k => { const a = attemptsOf(k).map(x => x.at).sort(); return a.length ? new Date(a[a.length-1]).getTime() : 0; };
  let k;
  if(filter && PATTERNS[filter]) k = filter;
  else if(passed.length && inSession % 5 === 4) k = passed.slice().sort((a,b) => lastAt(a) - lastAt(b))[0];      // about 1 in 5 items: spaced return
  else {
    const pool = PKEYS.filter(x => !isPassed(x));
    k = (pool.length ? pool : PKEYS).slice().sort((a,b) => attemptsOf(a).length - attemptsOf(b).length || lastAt(a) - lastAt(b) || PKEYS.indexOf(a) - PKEYS.indexOf(b))[0];
  }
  const items = SCENARIOS.filter(s => s.p === k && s.l === lv(k).cur);
  items.sort((a,b) => { const la = lastSeen(a.id), lb = lastSeen(b.id); return (la ? new Date(la).getTime() : 0) - (lb ? new Date(lb).getTime() : 0); });
  return items[0];
}

/* The avoidance mirror: names the situation without blocking. Never repeated within a session. */
function drillsSinceLive(){
  const last = state.entries.reduce((m,e) => e.at > m ? e.at : m, '');
  return { n:state.attempts.filter(a => a.kind === 'drill' && (!last || a.at > last)).length, hasLive:!!last };
}
function mirrorFor(){
  if(state.mirrorSession === sessionId()) return null;
  const d = drillsSinceLive(); if(d.n < 10) return null;
  const k = PKEYS.find(x => { const w = windowFor(x); return w.n === 4 && w.right === 4; });
  return k ? { k, n:d.n, hasLive:d.hasLive } : null;
}
function mirrorNode(){
  const m = mirrorFor(); if(!m) return null;
  state.mirrorSession = sessionId(); persist();
  const box = h('section',{class:'notice stack', 'data-test':'mirror', 'aria-label':'A note on your practice'},
    h('p',null,'You’ve drilled '+m.n+' times '+(m.hasLive ? 'since your last live entry' : 'since you started')+', and '+pname(m.k)+' is at 4 of 4. The drills are working. The next thing that will move you is one real checkpoint.'),
    h('div',{class:'row'}, linkBtn('#/quick','Open Quick Checkpoint','primary','mirror-open'),
      h('button',{type:'button', class:'btn', 'data-act':'mirror-later', onclick:() => { box.remove(); announce('Dismissed. It will not come back this session.'); $('#main').focus(); }}, 'Not yet')));
  return box;
}

/* ---- Drill runner ---- */
const STEP_Q = [ 'Which pattern is this?', 'Which check would you run, and against which source?', 'Which option would you choose?', 'Write your commitment sentence' ];
function newDrill(mode, itemId, extra){
  const it = SCEN(itemId);
  return Object.assign({ mode, item:itemId, step:0, sel:[null,null,null], commitment:'', checks:{ chosen:false, overridden:false }, first:isFirst(itemId),
    hintMode:hintMode(it.p), hintOpen:[false,false,false], attemptId:null, startedAt:iso(), at:iso() }, extra || {});
}
function inDrillNow(){ return /^#\/train\/(drill|placement)/.test(location.hash) && !!state.drafts.drill; }
function stepOk(s, i){ return i === s.a || (s.alt != null && i === s.alt); }
function scoreDrill(d){
  const it = SCEN(d.item);
  const ok1 = d.sel[0] != null && (it.s1.o[d.sel[0]] === it.s1.o[it.s1.a] || (it.s1.alt && it.s1.o[d.sel[0]] === it.s1.alt));
  return [ !!ok1, d.sel[1] != null && stepOk(it.s2, d.sel[1]), d.sel[2] != null && stepOk(it.s3, d.sel[2]) ];
}
function recordAttempt(d){
  const it = SCEN(d.item), steps = scoreDrill(d);
  const att = { id:nextId('a'), at:iso(), sessionId:sessionId(), kind:d.mode === 'placement' ? 'placement' : 'drill', item:d.item, pattern:it.p, level:it.l, first:d.first,
    sel:d.sel.slice(), steps, correct:steps.every(Boolean), commitment:d.commitment.trim(), words:words(d.commitment), checks:Object.assign({}, d.checks), hint:d.hintMode, hintsUsed:d.hintOpen.filter(Boolean).length };
  state.attempts.push(att);
  if(att.first && att.kind === 'drill') updateLevel(it.p);
  d.attemptId = att.id; d.step = 4; persist();
  return att;
}
function sysRow(ok, text, labels){ labels = labels || ['Matches the worked answer. ', 'Differs from the worked answer. ']; return h('div',{class:'check sys'}, h('span',{class:'icon','aria-hidden':'true'}, ok ? '✓' : '✗'), h('div',{class:'txt'}, h('strong',null, ok ? labels[0] : labels[1]), text, ' ', h('span',{class:'tag sys'},'Scored by the app'))); }
function selfRow(ok, text){ return h('div',{class:'check self', style:'cursor:default'}, h('span',{class:'icon','aria-hidden':'true'}, ok ? '☑' : '☐'), h('div',{class:'txt'}, h('strong',null, ok ? 'Ticked. ' : 'Not ticked. '), text, ' ', h('span',{class:'tag self'},'Self-reported'))); }

function feedbackNode(att){
  const it = SCEN(att.item);
  const nameOf = (i, idx) => idx == null ? 'no answer recorded' : i === 0 ? PATTERNS[it.s1.o[idx]].name : it['s'+(i+1)].o[idx];
  const blocks = [0,1,2].map(i => {
    const s = it['s'+(i+1)], chosen = att.sel[i], ok = att.steps[i];
    const label = ['Naming the pattern','The check','The option'][i];
    const keyText = nameOf(i, s.a);
    let meaning;
    if(ok){
      const isAlt = i === 0 ? (it.s1.o[chosen] === s.alt) : (s.alt != null && chosen === s.alt);
      if(isAlt) meaning = 'This counts as correct. '+(s.altNote || it.s1.altNote)+' The worked answer was: '+keyText+'.';
      else meaning = i === 0 ? 'The signal here was '+it.signal : i === 1 ? 'This checks the assumed constraint at its source.' : 'This is the option the worked answer reaches.';
      if(!isAlt && s.alt != null && s.altNote) meaning += ' A defensible alternative was also available: '+s.altNote;
    } else meaning = chosen == null ? 'No answer was recorded for this step.' : i === 0 ? it.s1.why[it.s1.o[chosen]] : s.why[chosen];
const action = i === 0 ? 'Look for this signal: '+it.signal : i === 1 ? (ok ? 'Keep choosing a check at the source, not one that asks people who share the assumption.' : 'The check that fits: “'+clean(keyText)+'”.') : (ok ? it.move : 'The option that fits: “'+clean(keyText)+'”. '+it.move);
    return h('section',{class:'stack', 'data-step':String(i+1), 'data-ok':ok ? 'yes' : 'no'}, h('h3',null,'Step '+(i+1)+': '+label),
      sysRow(ok, 'You chose: “'+clean(nameOf(i, chosen))+'”.'),
      h('p',null, h('strong',null,'What it means. '), meaning), h('p',null, h('strong',null,'What to do next. '), action));
  });
  const n = att.words, pass = n > 0 && n < 20;
  const stepFour = h('section',{class:'stack', 'data-step':'4'}, h('h3',null,'Step 4: The commitment sentence'), h('p',{class:'prose'}, '“'+att.commitment+'”'),
    sysRow(pass, 'Commitment sentence: '+n+' words. Criterion: under 20 words.', ['Pass. ', 'Not yet. ']),
    CHECKS.commit.map(c => selfRow(!!att.checks[c.k], c.t+'.')));
  return h('div',{class:'stack-l', 'data-test':'feedback'},
    h('section',{class:'stack'}, h('h2',null,'Worked answer'), h('p',{class:'prose', 'data-test':'worked'}, it.worked)),
    h('section',{class:'stack'}, h('h2',null,'Your answers, step by step'), blocks, stepFour));
}

function screenDrill(main, mode, filter){
  let d = state.drafts.drill;
  const wrap = h('div',{class:'stack-l', 'data-screen':'drill'});
  main.replaceChildren(wrap);
  if(!d){
    if(mode === 'placement') return placementIntro(wrap);
    const it = pickNext(filter);
    d = state.drafts.drill = newDrill('drill', it.id); persist();
  }
  const api = { changed(){ d.at = iso(); persistSoon(); } };
  const isPlace = d.mode === 'placement';
  function draw(moveFocus){
    if(d.step === 4) return drawFeedback(moveFocus);
    const it = SCEN(d.item), i = d.step;
    const err = h('p',{class:'problem', role:'alert', hidden:true, 'data-test':'problem'});
    const head = h('h1',{id:'step-h', tabindex:'-1'}, STEP_Q[i]);
    let body;
    if(i < 3){
      const s = it['s'+(i+1)];
      const name = nid('dr');

        inp.addEventListener('change', () => { d.sel[i] = idx; err.hidden = true; api.changed(); });
        list.append(h('label',{class:'choice'}, inp, h('span',{class:'body'}, i === 0 ? [h('span',{class:'name'}, PATTERNS[o].name), h('span',{class:'def'}, PATTERNS[o].def)] : o)));
      });
      const hintBox = h('div',{class:'stack'});
      const hintText = h('p',{class:'notice', 'data-test':'hint'}, h('strong',null,'Hint. '), it.h[i]);
      if(d.hintMode === 'shown'){ d.hintOpen[i] = true; hintBox.append(hintText); }
      else if(d.hintMode === 'tap'){
        const b = h('button',{type:'button', class:'btn', 'data-act':'hint', 'aria-expanded':d.hintOpen[i] ? 'true' : 'false', onclick:() => { d.hintOpen[i] = true; b.hidden = true; hintBox.append(hintText); api.changed(); announce('Hint: '+it.h[i]); }}, 'Show hint');
        b.hidden = d.hintOpen[i]; if(d.hintOpen[i]) hintBox.append(hintText);
        hintBox.prepend(b);
      }
      body = h('div',{class:'stack-l'}, i === 1 ? h('p',{class:'hint'},'The check is one concrete action you could finish in 15 minutes. ', defBtn('verification')) : (i === 0 ? h('p',{class:'hint'},'Look for the phrase or moment that shows a choice is being made. ', defBtn('decision-point')) : null), list, hintBox);
    } else body = commitmentBlock(d, api, { label:'Your commitment sentence for this scenario', hint:'Name the option you would choose and the default you are overriding.' });
    const last = i === 3;
    function advance(){
      if(i < 3 && d.sel[i] == null){ err.textContent = 'No option chosen. Choose the answer that fits best'+(d.hintMode !== 'withdrawn' ? ', or use the hint' : '')+'.'; err.hidden = false; err.setAttribute('tabindex','-1'); err.focus(); return; }
      if(last){ if(!d.commitment.trim()){ err.textContent = 'No sentence yet. Write one sentence that names the option you would choose.'; err.hidden = false; const t = wrap.querySelector('textarea'); t.setAttribute('aria-invalid','true'); t.focus(); return; }
        recordAttempt(d); draw(true); return; }

    wrap.replaceChildren(h('div',{class:'step stack-l'},
      h('div',{class:'stack'}, drillHeader(d), h('p',{class:'progress num'}, 'Step '+(i+1)+' of 4'), head), scenarioBlock(d), body, err,
      h('div',{class:'row actions'},
        i > 0 ? h('button',{type:'button', class:'btn big', 'data-act':'back', onclick:() => { d.step--; persist(); draw(true); }}, 'Back') : null,
        h('button',{type:'button', class:'btn primary big', 'data-act':'next', onclick:advance}, last ? 'See feedback' : 'Next')),
      h('div',null, h('button',{type:'button', class:'btn quiet', 'data-act':'discard', onclick:async () => {
        if(await confirmDialog({ title:'Discard this drill?', body:'Nothing from this scenario is logged.', confirmLabel:'Discard drill', cancelLabel:'Keep drill' })){ delete state.drafts.drill; persist(); location.hash = '#/train'; }
      }}, 'Discard drill'))));
    window.scrollTo(0,0);
    if(moveFocus){ head.focus(); announce('Step '+(i+1)+' of 4. '+STEP_Q[i]); } else head.focus({ preventScroll:true });
  }
  function drawFeedback(moveFocus){

      h('div',{class:'stack'}, drillHeader(d), head,
        h('p',{class:'lead', 'data-test':'summary'}, 'Steps 1 to 3: '+att.steps.filter(Boolean).length+' of 3 matched the worked answer. ', h('span',{class:'tag sys'},'Scored by the app')),
        h('p',null, 'The pattern was ', patternChip(k), ' at Level '+it.l+'. ',
          d.first ? 'This was a first attempt, so it counts towards the rolling window: ' : 'This was a retry. It is logged separately and does not move the rolling window: ',

        h('button',{type:'button', class:'btn primary big', 'data-act':'next-scenario', onclick:() => {
          if(isPlace){ if(fin) return finishPlacement(); d = state.drafts.drill = newDrill('placement', d.queue[d.qi+1], { queue:d.queue, qi:d.qi+1 }); persist(); draw(true); return; }
          delete state.drafts.drill; persist(); route(true);
        }}, isPlace ? (fin ? 'See where you start' : 'Next scenario') : 'Next scenario')),
      h('div',null, h('button',{type:'button', class:'btn quiet', 'data-act':'back-train', onclick:() => { delete state.drafts.drill; persist(); location.hash = '#/train'; }}, 'Back to Train'))));
    window.scrollTo(0,0);
    if(moveFocus){ head.focus(); announce('Feedback. Steps 1 to 3: '+att.steps.filter(Boolean).length+' of 3 matched the key.'); } else head.focus({ preventScroll:true });
  }
  draw(false);
}

function screenLearnCard(main, id){
  const c = CARD(id);
  if(!c) return main.replaceChildren(h('div',{class:'stack'}, h('h1',null,'Card not found'), h('p',{class:'problem'},'That Learn card does not exist. Open the list to choose one.'), linkBtn('#/train/learn','Open Learn','primary')));
  main.replaceChildren(h('div',{class:'stack-l', 'data-screen':'learn-card', 'data-card':id}, h('h1',null,c.title), h('p',{class:'lead'}, c.blurb), cardNodes(c, 2), h('div',null, linkBtn('#/train/learn','Back to Learn','quick'))));
}
function glossaryTerms(){
  const out = Object.keys(DEFS).map(k => ({ key:k, term:DEFS[k].term, line:DEFS[k].line, card:DEFS[k].card }));
  PKEYS.forEach(k => out.push({ key:'pattern:'+k, term:PATTERNS[k].name, line:PATTERNS[k].def, card:CARD_OF_PATTERN(k), pattern:k }));
  return out.sort((a,b) => a.term.localeCompare(b.term, 'en-GB'));
}
function screenGlossary(main){
  const terms = glossaryTerms();
  main.replaceChildren(h('div',{class:'stack-l', 'data-screen':'glossary'}, h('h1',null,'Glossary'),
    h('p',{class:'lead'},'Every term the app uses, with a one-line definition. “More” opens the full Learn card without leaving this page.'),
    h('dl',{class:'kv gloss', 'data-test':'glossary'}, terms.map(t => [ h('dt',{'data-term':t.key}, t.term), h('dd',null, t.line+' ', h('button',{type:'button', class:'link-btn', 'data-more':t.key, 'aria-label':'More about '+t.term, onclick:() => openCard(t.card)}, 'More')) ])),
    h('div',null, linkBtn('#/train','Back to Train','quick'))));
}
window.DDD_GLOSSARY = glossaryTerms().map(t => ({ key:t.key, term:t.term, card:t.card }));
window.DDD_BANK = SCENARIOS;
window.DDD_PATTERNS = PATTERNS;
window.DDD_LEARN = LEARN;

/* ---- Drill log: every attempt, first attempts and retries separately ---- */
function screenDrillLog(main){
  const wrap = h('div',{class:'stack-l', 'data-screen':'drill-log'}, h('h1',null,'Drill log'),
    h('p',{class:'hint'},'Every attempt, newest first. First attempts move your rolling window; retries are logged separately. Steps 1 to 3 are scored by the app.'));
  if(!state.attempts.length) wrap.append(h('p',null,'No drills yet. Open Train to start.'), linkBtn('#/train','Open Train','primary'));
  else wrap.append(h('ul',{class:'ledger'}, state.attempts.slice().sort((a,b) => new Date(b.at) - new Date(a.at)).map(a => {
    const it = SCEN(a.item) || { title:a.item };
    return h('li',{'data-attempt':a.id, 'data-first':a.first ? 'yes' : 'no'},
      h('div',null, h('span',{class:'badge'+(a.first ? '' : ' retro')}, a.first ? 'First attempt' : 'Retry'), h('span',{class:'badge'}, a.kind === 'placement' ? 'Placement' : 'Drill'), h('span',{class:'meta'}, fmtStamp(a.at))),
      h('div',{class:'title'}, it.title+' · Level '+a.level), chipsFor({ patterns:[a.pattern] }),
      h('div',{class:'meta'}, 'Steps 1 to 3: '+a.steps.filter(Boolean).length+' of 3 matched the worked answer (scored by the app). Commitment sentence: '+a.words+' words.'));
  })));
  wrap.append(h('div',null, linkBtn('#/log','Back to the glance','quick')));
  main.replaceChildren(wrap);
}

/* ================================================================
   9. SHELL, ROUTER, START
   ================================================================ */
function renderBanner(){
  const b = $('#banner');
  b.replaceChildren(unreadableKept ? h('div',{class:'banner', role:'status', 'data-test':'unreadable-banner'}, h('strong',null,'Saved data could not be read. '), 'The app started empty and kept a copy of the unreadable data in this browser. To restore, import a backup file in ', h('a',{href:'#/more'},'More'), '.') : '',
    storageOK ? '' : h('div',{class:'banner', role:'status', 'data-test':'storage-banner'},
    h('strong',null,'Storage is unavailable. '), 'Your data will not survive a reload in this browser. Use Export in ', h('a',{href:'#/more'},'More'), ' to save a copy.'));
}
const NAV = [['home','Home','#/home',['home','prepare','quick','checkpoint','autopsy']], ['train','Train','#/train',['train']], ['log','Log','#/log',['log']], ['more','More','#/more',['more','about']]];
function renderRail(name){
  $('#rail').replaceChildren(h('div',{class:'brand'},'Decide, Don\'t Default'),
    h('ul',null, NAV.map(n => h('li',null, h('a',{href:n[2], 'aria-current':n[3].includes(name) ? 'page' : null, 'data-nav':n[0]}, n[1])))));
}
const TITLES = { home:'Home', train:'Train', log:'Log', more:'More', about:'About', prepare:'Prepare', quick:'Quick Checkpoint', checkpoint:'Checkpoint', autopsy:'Autopsy' };
const SCREEN_FN = {
  home:screenHome, train:screenTrain, log:screenLog, more:screenMore, about:screenAbout,
  prepare:m => flowScreen(FLOWS.prepare,m), quick:m => flowScreen(FLOWS.quick,m), checkpoint:m => flowScreen(FLOWS.checkpoint,m), autopsy:m => flowScreen(FLOWS.autopsy,m)
};
let currentName = 'home';
function route(moveFocus){
  const parts = (location.hash || '#/home').replace(/^#\/?/,'').split('/');
  const name = SCREEN_FN[parts[0]] ? parts[0] : 'home';
  currentName = name;
  activity();
  const main = $('#main');
  SCREEN_FN[name](main, parts);
  renderRail(name);
  document.title = (TITLES[name] || 'Home')+' · Decide, Don\'t Default';
  if(moveFocus !== false){
    if(!FLOWS[name]){ const t = $('h1', main); if(t){ t.setAttribute('tabindex','-1'); t.focus({ preventScroll:true }); } window.scrollTo(0,0); }
  }
}
window.addEventListener('hashchange', () => route(true));
/* Returning to the app, or another tab saving: adopt the newest saved data. A screen that is mid-activity keeps its own drafts. */
function adoptNewest(){
  const live = !!FLOWS[currentName] || inDrillNow();
  const mine = state.drafts;
  if(!syncFromStorage()) return;
  if(live){ state.drafts = mine; persistSoon(); } else route(false);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ adoptNewest(); if(!FLOWS[currentName] && !inDrillNow()) route(false); } });
window.addEventListener('storage', e => { if(e.key === KEY) adoptNewest(); });
['click','keydown'].forEach(t => document.addEventListener(t, () => activity(), true));

/* Every screen and state, for the tests (16 and 18 run against this list). */
const SCREENS = [
  { id:'onboarding', hash:'#/home', fixture:'empty' },
  { id:'onboarding-storage-unavailable', hash:'#/home', fixture:'storage-blocked' },
  { id:'home', hash:'#/home', fixture:'populated' },
  { id:'log-empty', hash:'#/log', fixture:'empty' },
  { id:'log-glance', hash:'#/log', fixture:'populated' },
  { id:'log-full', hash:'#/log/all', fixture:'populated' },
  { id:'log-full-empty', hash:'#/log/all', fixture:'empty' },
  { id:'entry-prepare', hash:'#/log/e/e_prep', fixture:'populated' },
  { id:'entry-quick', hash:'#/log/e/e_quick', fixture:'populated' },
  { id:'entry-checkpoint', hash:'#/log/e/e_cp', fixture:'populated' },
  { id:'entry-autopsy', hash:'#/log/e/e_aut', fixture:'populated' },
  { id:'entry-not-found', hash:'#/log/e/nothing', fixture:'populated' },
  { id:'more', hash:'#/more', fixture:'populated' },
  { id:'more-storage-unavailable', hash:'#/more', fixture:'storage-blocked' },
  { id:'about', hash:'#/about', fixture:'populated' },
  { id:'dialog-pattern-definition', hash:'#/log/e/e_quick', fixture:'populated', click:['[data-pattern]'] },
  { id:'dialog-term-definition', hash:'#/log/e/e_quick', fixture:'populated', click:['[data-def]'] },
  { id:'dialog-delete-all', hash:'#/more', fixture:'populated', click:['[data-act=delete-all]'] },
  { id:'dialog-delete-entry', hash:'#/log/e/e_quick', fixture:'populated', click:['[data-act=delete-entry]'] },
  { id:'dialog-import-replace', hash:'#/more', fixture:'populated', import:true }
];
Object.keys(FLOWS).forEach(k => {
  FLOWS[k].steps.forEach((s,i) => {
    SCREENS.push({ id:k+'-step-'+(i+1), hash:'#/'+k, fixture:'drafts', draft:{ flow:k, step:i } });
  });
  SCREENS.push({ id:k+'-step-1-problem', hash:'#/'+k, fixture:'empty', click:['[data-act=next]'] });
  SCREENS.push({ id:k+'-discard-dialog', hash:'#/'+k, fixture:'empty', click:['[data-act=discard]'] });
  SCREENS.push({ id:k+'-done', hash:'#/'+k, fixture:'drafts', draft:{ flow:k, step:FLOWS[k].steps.length-1 }, click:['[data-act=next]'] });
});
SCREENS.push({ id:'home-pinned-and-next', hash:'#/home', fixture:'pinned' });
SCREENS.push({ id:'home-drafts', hash:'#/home', fixture:'drafts' });
SCREENS.push({ id:'glance-windows', hash:'#/log', fixture:'attempts' });
/* Very long unbroken words: the realistic way a layout breaks */
SCREENS.push(
  { id:'home-long-text', hash:'#/home', fixture:'stress' },
  { id:'log-glance-long-text', hash:'#/log', fixture:'stress' },
  { id:'log-full-long-text', hash:'#/log/all', fixture:'stress' },
  { id:'entry-prepare-long-text', hash:'#/log/e/e_prep', fixture:'stress' },
  { id:'entry-quick-long-text', hash:'#/log/e/e_quick', fixture:'stress' },
  { id:'entry-checkpoint-long-text', hash:'#/log/e/e_cp', fixture:'stress' },
  { id:'entry-autopsy-long-text', hash:'#/log/e/e_aut', fixture:'stress' },
  { id:'checkpoint-step-8-long-text', hash:'#/checkpoint', fixture:'stress', draft:{ flow:'checkpoint', step:7 } },
  { id:'quick-step-2-long-text', hash:'#/quick', fixture:'stress', draft:{ flow:'quick', step:1 } }
);
/* Session 2: Train, Learn, glossary, drills, placement, drill log, overlays */
SCREENS.push(
  { id:'train-fresh', hash:'#/train', fixture:'empty' },
  { id:'train-progress', hash:'#/train', fixture:'attempts' },
  { id:'train-passed-and-revisit', hash:'#/train', fixture:'revisit' },
  { id:'train-mirror', hash:'#/train', fixture:'mirror' },
  { id:'train-drill-in-progress', hash:'#/train', fixture:'empty', drill:{ step:1 } },
  { id:'learn-list', hash:'#/train/learn', fixture:'empty' },
  { id:'learn-card-not-found', hash:'#/train/learn/nothing', fixture:'empty' },
  { id:'glossary', hash:'#/train/glossary', fixture:'empty' },
  { id:'drill-log', hash:'#/log/drills', fixture:'attempts' },
  { id:'drill-log-empty', hash:'#/log/drills', fixture:'empty' },
  { id:'placement-intro', hash:'#/train/placement', fixture:'empty' },
  { id:'placement-result', hash:'#/train/placement/result', fixture:'placed' },
  { id:'more-with-levels', hash:'#/more', fixture:'placed' },
  { id:'log-glance-methods', hash:'#/log', fixture:'methods' },
  { id:'dialog-definition-more', hash:'#/checkpoint', fixture:'drafts', draft:{ flow:'checkpoint', step:3 }, click:['[data-def=verification]'] },
  { id:'dialog-learn-overlay', hash:'#/checkpoint', fixture:'drafts', draft:{ flow:'checkpoint', step:3 }, click:['[data-def=verification]', '[data-act=more]'] },
  { id:'dialog-pattern-more', hash:'#/log', fixture:'populated', click:['[data-pattern-row=sunk] .plink'] },
  { id:'dialog-decision-point-card', hash:'#/quick', fixture:'drafts', click:['[data-p=unsure]', '[data-more=decision-point]'] }
);
for(let i = 0; i < 4; i++) SCREENS.push({ id:'drill-step-'+(i+1), hash:'#/train/drill', fixture:'empty', drill:{ step:i } });
SCREENS.push(
  { id:'drill-step-1-problem', hash:'#/train/drill', fixture:'empty', drill:{ step:0 }, click:['[data-act=next]'] },
  { id:'drill-feedback-matched', hash:'#/train/drill', fixture:'empty', drill:{ step:4, right:true } },
  { id:'drill-feedback-missed', hash:'#/train/drill', fixture:'empty', drill:{ step:4, right:false } },
  { id:'drill-feedback-alternative', hash:'#/train/drill', fixture:'empty', drill:{ step:4, item:'I4', alt:true } },
  { id:'drill-hints-shown', hash:'#/train/drill', fixture:'empty', drill:{ step:0, hintMode:'shown' } },
  { id:'drill-hints-tap-open', hash:'#/train/drill', fixture:'empty', drill:{ step:0, hintMode:'tap' }, click:['[data-act=hint]'] },
  { id:'drill-retry', hash:'#/train/drill', fixture:'empty', drill:{ step:4, right:false }, click:['[data-act=retry]'] },
  { id:'placement-step-1', hash:'#/train/placement', fixture:'empty', drill:{ step:0, mode:'placement' } },
  { id:'placement-feedback', hash:'#/train/placement', fixture:'empty', drill:{ step:4, mode:'placement', right:false } },
  { id:'drill-discard-dialog', hash:'#/train/drill', fixture:'empty', drill:{ step:0 }, click:['[data-act=discard]'] }
);
LEARN.forEach(c => {
  SCREENS.push({ id:'learn-card-'+c.id, hash:'#/train/learn/'+c.id, fixture:'empty' });
  if(c.kind === 'method') SCREENS.push({ id:'learn-check-answered-'+c.id, hash:'#/train/learn/'+c.id, fixture:'empty', click:['[data-test=method-check] input[type=radio]', '[data-act=check-answer]'] });
});
window.DDD_SCREENS = SCREENS;

load();
activity(); persist();
renderBanner();
if(!location.hash) history.replaceState(null,'','#/home');
route(true);
})();
</script>
