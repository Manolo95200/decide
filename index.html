<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Decide, Don't Default</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDF0F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111C27">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A personal tool for the moment of choice: prepare, check, and review decisions.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Decide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E1A24'/%3E%3Crect x='7' y='7' width='18' height='18' rx='2' fill='none' stroke='%23EDF0F2' stroke-width='2.5'/%3E%3Cpath d='M11.5 16.5l3 3 6-7' fill='none' stroke='%23F2C230' stroke-width='3' stroke-linecap='square'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light dark;
  --paper:#EDF0F2; --surface:#FFFFFF; --ink:#0E1A24; --ink-2:#465662; --edge:#6F7D89; --mark:#F2C230;
  --p-instruction:#1D5FB5; --p-sunk:#A3325F; --p-phantom:#2B7038; --p-urgency:#93520A; --p-inertia:#6A45B0;
  --p-letter:#FFFFFF;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-read: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --t-s:.9375rem; --t-b:1.0625rem; --t-m:1.25rem; --t-l:1.5rem; --t-xl:1.875rem; --t-xxl:2.375rem;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --bar-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111C27; --surface:#1A2734; --ink:#E8EEF3; --ink-2:#A9B7C4; --edge:#71828F; --mark:#E0B93C;
    --p-instruction:#8DB8F2; --p-sunk:#F09AB9; --p-phantom:#8CD39A; --p-urgency:#F0BA6B; --p-inertia:#BFA9F0;
    --p-letter:#111C27;
  }
}
:root[data-theme="dark"]{
  --paper:#111C27; --surface:#1A2734; --ink:#E8EEF3; --ink-2:#A9B7C4; --edge:#71828F; --mark:#E0B93C;
  --p-instruction:#8DB8F2; --p-sunk:#F09AB9; --p-phantom:#8CD39A; --p-urgency:#F0BA6B; --p-inertia:#BFA9F0;
  --p-letter:#111C27;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:var(--t-b);line-height:1.5;overflow-wrap:anywhere;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1,h2,h3,p,ul,ol,dl,dd,fieldset,figure{margin:0}
ul,ol{padding-left:1.25em}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a{color:var(--ink);text-underline-offset:.18em}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:var(--s4);top:-100px;background:var(--ink);color:var(--paper);padding:var(--s3) var(--s4);z-index:100;border-radius:4px}
.skip:focus{top:var(--s2)}

/* layout */
.app{min-height:100vh;min-height:100dvh}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom)}
.rail ul{list-style:none;margin:0;padding:0;display:flex}
.rail li{flex:1}
.rail a{display:flex;align-items:center;justify-content:center;min-height:var(--bar-h);font-size:var(--t-s);font-weight:600;
  text-decoration:none;color:var(--ink-2);border-top:4px solid transparent;margin-top:-2px;padding:0 var(--s2);text-align:center}
.rail a[aria-current="page"]{color:var(--ink);border-top-color:var(--ink);font-weight:800}
.rail .brand{display:none}
.content{padding:var(--s5) var(--s4) calc(var(--bar-h) + var(--s7) + env(safe-area-inset-bottom));max-width:46rem;margin-inline:auto}
@media (min-width:56rem){
  .app{display:grid;grid-template-columns:14rem minmax(0,1fr)}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;border-top:0;border-right:2px solid var(--ink);padding:var(--s6) 0 var(--s5)}
  .rail ul{flex-direction:column}
  .rail .brand{display:block;font-weight:800;font-size:var(--t-m);line-height:1.2;padding:0 var(--s5) var(--s6)}
  .rail a{justify-content:flex-start;min-height:52px;padding:0 var(--s5);border-top:0;margin:0;border-left:6px solid transparent;font-size:var(--t-b)}
  .rail a[aria-current="page"]{border-left-color:var(--ink)}
  .content{padding:var(--s7) var(--s6) var(--s8);margin-inline:auto;width:100%;max-width:calc(46rem + 2 * var(--s6))}
}
main:focus,h1[tabindex="-1"]:focus,p[tabindex="-1"]:focus,.dialog:focus{outline:none}
.btn,.lead,.choice .def{text-wrap:balance}
.choice .def{text-wrap:pretty}
.stack>*+*{margin-top:var(--s4)}
.stack-l>*+*{margin-top:var(--s6)}

/* type */
h1{font-size:var(--t-xl);line-height:1.15;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h1.live{font-size:var(--t-xxl);line-height:1.1}
h2{font-size:var(--t-m);line-height:1.25;font-weight:800;padding-top:var(--s3);border-top:2px solid var(--ink);overflow-wrap:anywhere}
h3{font-size:var(--t-b);font-weight:700;overflow-wrap:anywhere}
p,li{overflow-wrap:anywhere}
.prose{font-family:var(--f-read);line-height:1.6}
.prose p,.prose li,.prose{max-width:54ch}
.prose li+li{margin-top:var(--s2)}
.small{font-size:var(--t-s)}
.muted{color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:var(--t-b);max-width:54ch}
.gloss dt{font-size:var(--t-m);font-weight:800;color:var(--ink);line-height:1.25}
.gloss dd{max-width:54ch}
details.scn{border-top:2px solid var(--ink)}
details.scn summary{min-height:48px;display:flex;align-items:center;font-weight:800;font-family:var(--f-ui);cursor:pointer;padding:var(--s2) 0}
details.scn[open] summary{border-bottom:1px solid var(--edge);margin-bottom:var(--s3)}
p,li,dd{max-width:54ch}
.num{font-variant-numeric:tabular-nums}
.progress{font-size:var(--t-s);color:var(--ink-2);font-weight:600}
.lead{font-size:var(--t-m);line-height:1.4;max-width:52ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:var(--s2) var(--s5);border-radius:4px;
  border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;text-align:center;
  font-size:var(--t-b);line-height:1.25;overflow-wrap:anywhere}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.big{min-height:56px;font-size:var(--t-m)}
.btn.block{display:flex;width:100%}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:.2em;padding-inline:0;min-width:44px;justify-content:flex-start}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.row>*{min-width:0}
.q-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;padding:0;vertical-align:middle}
.q-btn span{display:inline-flex;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);align-items:center;justify-content:center;font-size:var(--t-s);font-weight:800;line-height:1}
.link-btn{background:none;border:0;padding:0;min-height:44px;min-width:44px;font-weight:700;text-decoration:underline;text-underline-offset:.2em;cursor:pointer;text-align:left}

/* fields */
label.field,.field-label{display:block;font-weight:700;margin-bottom:var(--s2)}
.field-wrap+.field-wrap{margin-top:var(--s5)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{display:block;width:100%;min-height:48px;padding:var(--s3);
  background:var(--surface);border:2px solid var(--edge);border-radius:4px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{min-width:28px;min-height:28px;cursor:pointer;border-radius:2px}
input[type=date]::-webkit-calendar-picker-indicator:focus-visible,input[type=time]::-webkit-calendar-picker-indicator:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=file]{display:block;width:100%;min-height:48px;padding:var(--s2);background:var(--surface);border:2px solid var(--edge);border-radius:4px}
input[type=file]::file-selector-button{min-height:36px;padding:0 var(--s4);margin-right:var(--s3);border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:4px;cursor:pointer}
textarea{min-height:6.5rem;resize:vertical;line-height:1.45}
textarea.short{min-height:4.5rem}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:1}
input[aria-invalid=true],textarea[aria-invalid=true],select[aria-invalid=true]{border-color:var(--ink);border-width:3px}
.problem{border-left:6px solid var(--ink);background:var(--surface);padding:var(--s3) var(--s4);font-weight:600}
.problem::before{content:"Problem: ";font-weight:800}

/* choice rows (radio / pressed) */
.choices{display:grid;gap:var(--s2)}
.choice{display:flex;gap:var(--s3);align-items:flex-start;width:100%;min-height:56px;padding:var(--s3) var(--s4);text-align:left;
  background:var(--surface);border:2px solid var(--edge);border-radius:4px;cursor:pointer}
.choice input[type=radio]{margin-top:.35em;width:20px;height:20px;flex:none;accent-color:var(--ink)}
.choice.pressed,.choice:has(input:checked),.choice[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.choice .def{display:block;font-weight:400;font-size:var(--t-b)}
.choice .name{font-weight:800;font-size:var(--t-m);display:block;line-height:1.25}
.choice .tick{margin-left:auto;flex:none;width:28px;height:28px;border:2px solid currentColor;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.choice .tick::after{content:""}
.choice[aria-pressed=true] .tick::after{content:"\2713"}
.choice .body{flex:1;min-width:0;max-width:54ch}
.choice:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.choice[aria-pressed=true]:focus-visible{outline-color:var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.choice:has(input:checked):focus-within{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}

/* pattern mark: shape + letter, never colour alone */
.mark{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;color:var(--p-letter);font-weight:800;font-size:.8125rem;line-height:1;background:var(--pc,var(--ink))}
.mark[data-p=instruction]{--pc:var(--p-instruction);border-radius:2px}
.mark[data-p=sunk]{--pc:var(--p-sunk);border-radius:50%}
.mark[data-p=phantom]{--pc:var(--p-phantom);clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:8px}
.mark[data-p=urgency]{--pc:var(--p-urgency);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mark[data-p=inertia]{--pc:var(--p-inertia);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.mark[data-p=unknown]{--pc:transparent;border:2px dashed currentColor;color:inherit;border-radius:50%}
.choice[aria-pressed=true] .mark{outline:2px solid var(--paper);outline-offset:1px}
.pchip{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:var(--s1) var(--s3) var(--s1) var(--s2);background:var(--surface);border:2px solid var(--edge);
  border-radius:4px;font-weight:700;cursor:pointer;font-size:var(--t-s)}
.pchip .mark{width:24px;height:24px;font-size:.75rem}
.pchip .mark[data-p=phantom]{padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* labelled results: system-scored vs self-reported */
.checks{border:0;padding:0;margin:0;min-width:0}
.checks legend{font-weight:800;padding:0;margin-bottom:var(--s2)}
.check{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);min-height:56px;background:var(--surface);margin-top:var(--s2)}
.check.sys{border:2px solid var(--ink)}
.check.self{border:2px dashed var(--edge);cursor:pointer}
.check .icon{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;line-height:1}
.check.sys .icon{background:var(--ink);color:var(--paper);border-radius:2px}
.check.self input{flex:none;width:24px;height:24px;margin:2px 0 0;accent-color:var(--ink)}
.check .txt{flex:1;min-width:0;max-width:54ch}
.tag{display:inline-block;font-size:var(--t-s);font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:0 var(--s2);margin-left:var(--s1);white-space:nowrap;color:var(--ink-2)}
.tag.sys{border-style:solid;border-radius:2px;color:var(--ink)}
.tag.self{border-style:dashed}
.count{font-weight:700}

/* pinned Prepare card, notices, dialogs */
.pinned{background:var(--surface);border:2px solid var(--ink);border-top-width:12px;border-top-color:var(--mark);padding:var(--s4) var(--s4) var(--s5)}
.pinned h2{border:0;padding:0;font-size:var(--t-l);line-height:1.2}
.pinned dl{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);margin-top:var(--s3)}
.pinned dt{font-weight:700;font-size:var(--t-s);color:var(--ink-2)}
.pinned dd{font-size:var(--t-m);line-height:1.35}
.notice{background:var(--surface);border-left:12px solid var(--mark);border-top:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:var(--s4)}
.banner{background:var(--surface);border-bottom:2px solid var(--ink);border-left:12px solid var(--mark);padding:var(--s3) var(--s4)}
h2+.ledger>li:first-child{border-top:0}
.hero{min-height:7.5rem;font-size:var(--t-xl)!important;padding:var(--s4) var(--s5)}
.hero span:last-child{font-size:var(--t-b)!important}
.actions{position:sticky;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));z-index:5;background:var(--paper);border-top:2px solid var(--ink);padding:var(--s3) 0;margin-top:var(--s5)}
@media (min-width:56rem){.actions{bottom:0}}
.ledger{list-style:none;padding:0;margin:0}
.ledger>li{border-top:1px solid var(--edge);padding:var(--s3) 0}
.ledger>li:last-child{border-bottom:1px solid var(--edge)}
.entry-link{max-width:46ch;display:block;text-decoration:none;color:inherit;padding:var(--s1) 0;min-height:44px}
.entry-link:hover .title{text-decoration:underline}
.entry-link .title{font-weight:700;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:var(--t-s);font-weight:800;border:2px solid var(--ink);border-radius:2px;padding:0 var(--s2);margin-right:var(--s2)}
.badge.retro{border-style:dashed}
.meta{color:var(--ink-2);font-size:var(--t-s)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,18,26,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade 180ms ease-out}
.dialog{background:var(--surface);color:var(--ink);border:2px solid var(--ink);width:100%;max-width:34rem;max-height:90vh;max-height:90dvh;overflow:auto;padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));animation:rise 200ms ease-out}
.dialog h2{border:0;padding:0;margin-bottom:var(--s3)}
@media (min-width:40rem){.scrim{align-items:center}.dialog{padding-bottom:var(--s5)}}
.step{animation:rise 180ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s1)}
.kv dt{font-weight:700;font-size:var(--t-s);color:var(--ink-2)}
.kv dd{margin:0 0 var(--s3);overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%}
.counts{list-style:none;padding:0;margin:0}
.counts>li{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--edge)}
.counts .who{display:flex;align-items:center;gap:var(--s2);flex:1 1 14rem;min-width:0}
.counts .n{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--t-s);font-variant-numeric:tabular-nums}
.calc{background:var(--surface);border:2px solid var(--ink);padding:var(--s4)}
.calc .result{font-weight:800;font-size:var(--t-m);margin-top:var(--s3)}
.grid2{display:grid;gap:var(--s4)}
@media (min-width:40rem){.grid2{grid-template-columns:1fr 1fr}}
.plink{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:.2em;cursor:pointer;position:relative;display:inline;text-align:inherit}
.plink::after{content:"";position:absolute;inset:-12px -2px}
.dialog.wide{max-width:44rem}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app" id="app">
  <nav class="rail" aria-label="Main" id="rail"></nav>
  <div class="content" id="content">
    <div id="banner"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<div id="count-live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">This app needs JavaScript to run.</p></noscript>
<script>
'use strict';
(function(){

/* ================================================================
   1. CLOCK — the only place the current time is read
   ================================================================ */
function now(){
  const o = window.__nowOverride;               // test scripts only; never exposed in the interface
  return (typeof o === 'number' || typeof o === 'string') ? new Date(o) : new Date();
}
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(now());
const iso = () => now().toISOString();
function dparts(s){ const a = s.split('-').map(Number); return a; }
function addDays(s,n){ const [y,m,d] = dparts(s); return ymd(new Date(y,m-1,d+n)); }
function dayDiff(a,b){ const [y1,m1,d1] = dparts(a), [y2,m2,d2] = dparts(b); return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000); }
function eventAt(p){ const [y,m,d] = dparts(p.date); const t = (p.time||'23:59').split(':').map(Number); return new Date(y,m-1,d,t[0],t[1]||0); }
function fmtDate(s){ const [y,m,d] = dparts(s); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtStamp(isoStr){ const d = new Date(isoStr); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDay(isoStr){ return fmtDate(ymd(new Date(isoStr))); }
const MIN = 60000, DAY = 86400000;

/* ================================================================
   2. CONTENT — patterns, cues, definitions, claims, adaptations
   ================================================================ */
const PATTERNS = {
  instruction:{ name:'Instruction Compliance', letter:'I',
    def:'You follow the first instruction you were given, or the one from whoever has authority, without checking it against your own analysis.',
    cues:[
      {cue:'someone says "we just need you to agree to this today"', action:'ask which part is fixed, and read my analysis line aloud before I answer'},
      {cue:'the agent says "that is how it is always done"', action:'ask to see it written in the contract before I agree'},
      {cue:'a manager gives me a direction that conflicts with my analysis', action:'state my analysis in one sentence before I comply'}
    ]},
  sunk:{ name:'Sunk Cost Loyalty', letter:'S',
    def:'You keep going with something because of what you have already put in (money, time, effort), not because of what it will give you from here.',
    cues:[
      {cue:'I hear myself say "we have already put in…"', action:'write down what each option gives me from today onward, and compare only that'},
      {cue:'I am about to keep a subscription or course because I have already paid for it', action:'ask "Would I choose this today, starting fresh?" and answer it aloud'},
      {cue:'I catch myself defending past effort in a conversation', action:'name the past cost aloud, then set it aside and restate the choice'}
    ]},
  phantom:{ name:'Phantom Constraint', letter:'P',
    def:'You treat a rule, limit or requirement as fixed without checking that it exists at its source.',
    cues:[

{ id:'I1', p:'instruction', l:1, cat:'Salary and praise', title:'The self-review',
  text:"It is Thursday and you are filling in your annual self-review at the desk by the window that never quite closes. Your analysis is plain: you delivered three projects this year and two came in early, so “exceeds expectations” is the accurate rating. Your manager, Dan, leans over and says, “Just tick meets expectations, that’s what everyone here puts.” He is already walking off towards the kitchen.",

  s2:{ o:["Ask two colleagues what they ticked (direct question).","Read the rating guidance on the HR intranet page to see whether any rule limits the top rating (official page).","Re-read your list of projects and dates (your own notes).","Tick “meets” now and add a comment saying you disagree (no source)."], a:1,

  s3:{ o:["Tick “meets expectations” as Dan said and raise it next year.","Tick “exceeds expectations”, attach the three project dates, and tell Dan you are happy to discuss it.","Leave the form blank until Dan comes back.","Ask Dan which box he would like you to tick."], a:1,

  text:"Your letting agent, Priya, emails at lunchtime: “Please sign the attached renewal and send it back this week. It’s the standard one.” You are two days into a new job, and the renewal has been lying under a takeaway menu from the Thai place. Your notes from last week say: renew for twelve months with a break clause after six, because the job might move you to Leeds. The attachment is a 24-month agreement, and you have read only the first page. Nobody has said what happens if you do not return it this week.",

  s2:{ o:["Sign it and ask about a break clause afterwards (no source).","Ask your new colleagues what they would do (direct question).","Email Priya asking whether a 12-month term with a six-month break clause is offered, and read the term clause in the attached agreement (contract text).","Search online for the usual length of a tenancy (search results)."], a:2,
