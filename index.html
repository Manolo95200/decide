  s2:{ o:["Ask Kit what they would do (direct question).","Check the gym’s cancellation, freeze and refund terms in your membership contract (contract text).","Count how many pounds each visit has cost so far (your own receipts).","Wait until the last month, then decide (no source)."], a:1,
    why:["Kit has already given a view, and it rests on the past payment.",null,"That figure only restates what is already spent. It does not check what the contract lets you do now.","This leaves the choice to the calendar and gives up the remaining months of a better option."] },
  s3:{ o:["Go to the gym three times a week until the year runs out, to get your money’s worth.","Keep the gym and also join the pool, so the £480 is not wasted.","Choose what you would choose starting fresh: the pool near your office, and cancel or pause the gym if the contract allows."], a:2,
    why:["This spends future time to justify past money.","This adds a new £40 a month to protect the old £480.",null] },
  h:["Which numbers change if you choose differently from today, and which do not?","The check is on what the contract allows now, not on what has already gone.","Pick the option you would choose if you had paid nothing."],
  worked:"Observation: “you’ve already paid” is the only reason offered for staying. Meaning: the £480 is spent whichever you choose, so it cannot separate the options; the pool near your office can. Action: read the contract’s exit terms (15 minutes), then move to the pool and cancel or pause the gym if allowed." },

{ id:'S2', p:'sunk', l:1, cat:'Purchases', title:'The laptop repair',
  text:"Your laptop’s hinge snapped in March, and since then you have paid £110 for a new screen and £65 for a battery, at a repair shop above a bakery that smells of cardamom. Now the keyboard has failed. The repair quote is £140. A refurbished laptop with the same specification is £310, with a one-year warranty. This morning you worked out that the old one will probably fail again and that the refurbished one is the better buy. Your brother says, “After all you’ve put into that thing, one more repair makes sense.”",
  signal:"“After all you’ve put into that thing”: money already spent is the argument for spending more.",
  move:"Price only the future: the repair and what it is likely to lead to, against the replacement and its warranty.",
  s1:{ o:['urgency','sunk','inertia'], a:1, why:{ urgency:"No deadline is mentioned. The pull is the £175 already spent.", inertia:"Nothing is sliding. You have a quote and a comparison in front of you." } },
  s2:{ o:["Ask your brother how many repairs his phone needed (direct question).","Ask the repair shop whether they think the laptop will fail again (direct question).","Add up everything you have spent on the laptop so far (your own receipts).","Read the refurbished seller’s warranty page to see what the one-year warranty covers (official page)."], a:3,
    why:["His phone’s history says nothing about this laptop or this seller’s warranty.","The shop earns from repairs, so its answer is not a neutral source.","The total spent so far does not bear on the choice. It is the same either way.",null] },
  s3:{ o:["Pay £140 for the repair, because of the £175 already spent.","Buy the refurbished laptop and stop repairing the old one.","Pay for the repair now and buy a laptop later, if this fails too."], a:1,
    why:["This buys more of an asset your own analysis has already ruled out, because of money that is gone.",null,"This adds a second cost to test something you have already judged, and keeps the past spending in charge."] },
  h:["Which of the numbers in this story can you still change?","Look for the check that tells you what you would get for the money you have not yet spent.","Pick the option you worked out this morning, unless the check overturns it."],
  worked:"Observation: the argument for repairing is “after all you’ve put into it”. Meaning: the £175 is gone either way; only £140 for a likely repeat failure versus £310 with a warranty is still open. Action: read the warranty terms, then buy the refurbished laptop if they hold up." },

{ id:'S3', p:'sunk', l:2, cat:'Interviews and role plays', title:'Round four',
  text:"You are three rounds into a hiring process for a senior analyst role at a logistics firm. You have prepared for eleven evenings and bought a £90 suit. The third-round interviewer mentioned, between sips of very milky tea, that the team is being restructured in spring. The job description has changed twice, and the salary band seems lower than the recruiter first said, though nobody has written the figure down. A fortnight ago your notes said you would only take the role at the original band. The recruiter now says round four is “a formality”, and you find yourself drafting a thank-you email about how much you want the role.",
  signal:"Eleven evenings, a suit, three rounds: effort already spent is shaping how much you say you want the role.",
  move:"Ask for the current terms in writing before spending another evening, and decide against your notes.",
  s1:{ o:['phantom','instruction','sunk'], a:2, why:{ phantom:"No one has told you a limit applies. The band is unclear, which is a fact to check, not a rule you are assuming.", instruction:"The recruiter’s “formality” is a nudge, not an order you feel bound to follow. The pull is the effort you have already put in." } },
  s2:{ o:["Prepare more for round four (your own notes).","Ask the recruiter in writing for the current salary band and reporting line, and whether the restructure affects the role (direct question).","Ask a friend who once worked there what they think (direct question).","Re-read the original advert (official page)."], a:1,
    why:["More preparation deepens the investment and answers none of the open questions.",null,"A friend’s impression is second-hand and possibly out of date. The recruiter can state the current terms.","The original advert shows the old band you already know. The changes came after it."] },
  s3:{ o:["Attend round four because of the eleven evenings and the suit.","Ask for the current band in writing before agreeing to round four, and withdraw if it is below your original band.","Attend round four and decide about the band afterwards.","Withdraw now, without asking anything."], a:1,
    why:["This lets the effort already spent decide, when the effort is gone whichever you choose.",null,"This spends another evening before you know whether the role meets your own condition.","This skips a check that takes minutes, and you would never learn whether the band was actually lower."] },
  h:["Which of these costs can you still avoid, and which are gone?","The check is the current band and reporting line, from the person who can state them.","Choose the option that tests your own condition before you spend anything more."],
  worked:"Observation: you are drafting a keen email while the band, the job description and the team are all uncertain. Meaning: the eleven evenings and the suit are spent whether you continue or not; the current terms are what decide. Action: email the recruiter for the band and reporting line, then withdraw if it falls below the original band." },

{ id:'S4', p:'sunk', l:3, cat:'Relationships and lifestyle money', title:'The deposit',
  text:"Your parents, Marian and Ted, have already paid a £3,000 non-refundable deposit for a wedding venue with a view of a reservoir, and they want a March date. Last year your partner, Leila, and you agreed privately that a small ceremony for under £4,000 all-in is what you want. The venue’s minimum spend is £9,500. Ted says, “We’ve put the deposit down. We’re not walking away from that, and it’s what your mother wants.” Leila, whose cousin is a caterer, says she doesn’t mind either way. The venue has a cancellation page that nobody has opened.",
  signal:"“We’ve put the deposit down”: past money is the argument, backed by a parent’s wishes.",
  move:"Treat the deposit as spent, check what the venue’s terms allow, and compare the two futures only.",
  s1:{ o:['instruction','sunk','phantom','urgency'], a:1, alt:'instruction',
    altNote:"Instruction Compliance is also defensible: Ted’s “it’s what your mother wants” is an instruction from people you defer to. The worked answer is Sunk Cost Loyalty, because the argument carrying the weight is “we’ve put the deposit down”.",
    why:{ instruction:"Accepted as a defensible alternative.", phantom:"“Non-refundable” is a stated term, not an assumed limit. The strongest pull is the money already paid.", urgency:"The March date is Ted’s preference. No timer or deadline is working on you." } },
  s2:{ o:["Ask Marian what she wants (direct question).","Compare the prices of two other venues (official pages).","Read the venue’s cancellation and date-change terms on its booking page, and ask whether the £3,000 can be moved to a smaller event (official page).","Ask Leila to decide (direct question)."], a:2,
    why:["What Marian wants is part of the pull. It does not test what the venue’s terms allow.","Useful later, but it does not check whether the deposit can be moved or reduced, which is what your analysis depends on.",null,"Leila has already said she is flexible. The open question is what the terms say."] },
  s3:{ o:["Book the venue at £9,500 to honour the deposit.","Read the terms, then tell Marian and Ted that you will treat the £3,000 as spent and hold the ceremony you agreed with Leila, unless the terms let the deposit transfer.","Ask Marian and Ted to decide, since they paid.","Cancel by text tonight without reading the terms."], a:1,
    why:["This adds £6,500 of spending to defend £3,000 that is gone.",null,"This gives away a decision that is yours and Leila’s, and leaves your agreed plan out of it.","This skips the one check that might let the deposit be used, and starts the conversation with a rupture."] },
  h:["Which money is already gone whatever you choose, and whose decision is the wedding?","Look for the check that tells you what the £3,000 can still do, from the venue’s own page.","Choose the option that keeps your agreed plan, and treats the deposit as spent."],
  worked:"Observation: the case for the venue is “we’ve put the deposit down”, delivered with a parent’s authority. Meaning: the deposit is lost or moved whichever way you choose; the minimum spend of £9,500 is what you would add. Action: read the venue’s terms, tell your parents plainly that you will hold the agreed ceremony, and use the deposit only if the terms let it transfer." },

{ id:'P1', p:'phantom', l:1, cat:'Tenancy and contracts', title:'The mobile contract',
  text:"A rival offers the same data allowance for £11 a month less than you pay your mobile provider. You tell yourself, “I’m locked in until next March, so there’s nothing to do.” The corner of your phone case is cracked and catches on your pocket every day. You signed up on the provider’s website one evening and never opened the PDF they sent.",
  signal:"“I’m locked in, so there’s nothing to do”: a limit you believe in and have not read.",
  move:"Write the constraint as a sentence, name where it is written, and read that source.",
  s1:{ o:['sunk','phantom','inertia'], a:1, why:{ sunk:"You are not defending money already spent. You are treating a belief about the contract as a fact.", inertia:"Inertia is drift with no date. Here the pull is a belief about a rule, and you have already decided that nothing can be done." } },
  s2:{ o:["Ask a friend whether they left a contract early (direct question).","Open the PDF and read the early-termination and notice sections (contract text).","Search “can I leave my mobile contract early” (search results).","Wait until March (no source)."], a:1,
    why:["Your friend’s contract is not yours.",null,"A general search tells you what happens for other contracts. It cannot tell you what yours says.","This treats the constraint as true and gives up the £11 a month until then."] },
  s3:{ o:["Stay put until March.","Leave without reading anything and see what happens.","Read the exit terms, compare any exit fee with the £11 a month saving, and choose from the numbers."], a:2,
    why:["This accepts the assumed constraint and pays for it.","This risks an exit fee you have not seen, and skips the 15-minute check.",null] },
  h:["Is “locked in” something you read, or something you remember?","The check is in the document you were sent, not in someone else’s experience.","Choose from the numbers once you have them."],
  worked:"Observation: “I’m locked in” is stated as fact, but you never opened the contract. Meaning: the constraint may exist, may cost a fee, or may not exist at all. Action: read the early-termination section, then compare any fee with the saving of £11 a month." },

{ id:'P2', p:'phantom', l:1, cat:'Tenancy and contracts', title:'The cat',
  text:"A rescue centre’s website lists a grey cat called Biscuit. You think, “My tenancy won’t allow pets, so it’s not an option,” and you are about to send a polite “sorry, can’t” email to the centre. You have lived in the flat for two years, and the boiler makes a noise like a kettle. When you moved in, your friend told you that landlords never allow pets. You have not read the pets clause.",
  signal:"“My tenancy won’t allow pets”: a rule you assume and have not read.",
  move:"Find the clause, and if it is unclear, ask the person who decides.",
  s1:{ o:['instruction','phantom','urgency'], a:1, why:{ instruction:"Nobody has told you what to do. You are deciding on a belief about a rule.", urgency:"No deadline appears in the story. Nothing is forcing the pace." } },
  s2:{ o:["Read the pets clause in your tenancy agreement (contract text).","Ask your friend again what landlords allow (direct question).","Ask your neighbours whether they have pets (direct question).","Send the “sorry” email and check later (no source)."], a:0,
    why:[null,"Your friend’s remark from two years ago is where the belief came from, not a check on it.","Your neighbours’ agreements may differ from yours, and their landlords may too.","This acts on the belief first, and closes off the option before you know it exists."] },
  s3:{ o:["Send the “sorry, can’t” email.","Adopt Biscuit and say nothing to your landlord.","Read the clause, and if it is unclear, ask your landlord in writing for permission before deciding."], a:2,
    why:["This settles the question by the belief, not the document.","This risks your tenancy on a rule you have not read.",null] },
  h:["Where would the rule be written, and have you read that page?","The check is the tenancy agreement itself, not what people say landlords do.","Choose the option that ends with the answer in writing."],
  worked:"Observation: “my tenancy won’t allow pets” rests on a friend’s remark two years ago. Meaning: the clause may forbid, permit or require consent; you do not know which. Action: read the pets clause, and if it needs consent, ask your landlord in writing before replying to the centre." },

{ id:'P3', p:'phantom', l:2, cat:'Salary and praise', title:'The April rule',
  text:"Since June you have taken on two people’s worth of accounts, and your manager, Hana, praised the November close in the team channel, with a thumbs-up and a small cake. You would like a pay rise. You keep telling yourself, “The company only does pay reviews in April, and only cost-of-living ones, so there’s no point asking.” Your colleague Tomás got a mid-year adjustment last year, but “that was probably a special case”. The staff handbook is on the shared drive. You have never searched it.",
  signal:"“The company only does pay reviews in April”: a rule you have described from memory.",
  move:"Find the policy text before you decide whether to ask, then ask for what the policy allows.",
  s1:{ o:['inertia','instruction','phantom'], a:2, why:{ inertia:"Inertia is a task with no date sliding. Here the pull is a belief about a rule (“only April”) that you have not checked.", instruction:"Nobody has told you what to do. The barrier is a rule you believe in." } },
  s2:{ o:["Ask Tomás what he did (direct question).","Ask Hana over coffee whether now is a good time (direct question).","Search the staff handbook’s pay policy section (official page).","Wait for April and see (no source)."], a:2,
    why:["Useful colour, but Tomás is not the source of the policy, and “probably a special case” is a guess.","Hana can give an opinion on timing. That is not the same as the written rule.",null,"This treats the belief as true and postpones the check by five months."] },
  s3:{ o:["Wait for April.","Ask Tomás to raise it on your behalf.","Email HR asking for a rise without reading the policy.","Read the policy; if mid-year adjustments exist, book 20 minutes with Hana and bring the workload changes; if not, ask what evidence she would want for April."], a:3,
    why:["This accepts the assumed rule and postpones by five months.","This puts your case in someone else’s hands and skips the policy.","This asks before you know what the policy allows, which weakens the request.",null] },
  h:["Which sentence in this story is something you read, and which is something you remember?","The check is the written policy, not a colleague’s story or your manager’s mood.","Choose the option that works out what to ask for from what the policy says."],
  worked:"Observation: “only April, only cost-of-living” is a rule you describe from memory, and one colleague’s example points the other way. Meaning: the policy may allow mid-year adjustments; you do not know. Action: search the handbook for 15 minutes, then ask Hana for the conversation the policy allows." },

{ id:'P4', p:'phantom', l:3, cat:'Admin processes', title:'The system can’t',
  text:"You ring your bank because a £1,900 payment towards a tenancy deposit has been held. The adviser, briskly, with a keyboard clattering behind, says, “The system can’t release it before Monday, that’s just how it works,” and adds that if you do not confirm today you will lose the flat. You are eating a cold slice of toast as you listen. The letting agent had told you the deadline is “the end of the week”.",
  signal:"“The system can’t… that’s just how it works”: a limit stated as fact, with a deadline attached, from someone with authority.",
  move:"Ask for the rule, the team that owns it, and the true deadline, before deciding anything.",
  s1:{ o:['urgency','phantom','instruction','inertia'], a:1, alt:'urgency',
    altNote:"Urgency Grab is also defensible: “confirm today or lose the flat” is a deadline someone else imposed. The worked answer is Phantom Constraint, because the claim carrying the decision is “the system can’t”, which can be checked.",
    why:{ urgency:"Accepted as a defensible alternative.", instruction:"The adviser is not telling you what to do. The adviser is telling you what cannot be done.", inertia:"Nothing is sliding. A decision is being pressed on you right now." } },
  s2:{ o:["Ask the adviser to name the rule behind “can’t release before Monday”, and to put you through to the payments team (direct question).","Ask your flatmate whether banks really do this (direct question).","Confirm the payment today to be safe (no source).","Email the agent to confirm in writing what the real deadline is (direct question)."], a:0, alt:3,
    altNote:"Also defensible: emailing the agent to confirm the real deadline checks the urgency claim at its source.",
    why:[null,"Your flatmate can only guess at this bank’s systems.","This acts before checking either claim, and “to be safe” is the urgency pull itself.","Accepted as a defensible alternative."] },
  s3:{ o:["Accept “that’s how it works” and wait until Monday.","Ask for the payments team, and tell the agent you are waiting on the bank while asking for the deadline in writing.","Pay £1,900 from your savings today, then chase the bank."], a:1,
    why:["This accepts the limit as stated and risks the flat if the agent’s deadline is earlier.",null,"This settles the urgency and leaves the claim unchecked. It may not be needed if the agent’s deadline really is the end of the week."] },
  h:["Which two claims are being made on this call, and who could confirm each?","One check asks the rule’s owner for the rule. Another asks the agent for the deadline.","Choose the option that keeps both routes open and gets things in writing."],
  worked:"Observation: the adviser states a limit (“can’t release”) and a deadline (“today”) in one breath, with authority. Meaning: both are claims you can test: the bank’s rule, and the agent’s actual deadline (“the end of the week”). Action: ask the payments team for the rule and the agent for the deadline in writing, and decide after that." },

{ id:'U1', p:'urgency', l:1, cat:'Purchases', title:'The sofa timer',
  text:"A furniture site shows a three-piece sofa at £1,240 with a clock reading 00:47:12 and “only 2 left in this colour”. Last Sunday you decided to compare three shops and wait for the January sales. The sofa you have is fine apart from one cushion your dog has chewed. It is 11:50 pm, and you are in bed with toast crumbs on the duvet.",
  signal:"A price with a timer: someone else’s clock is making the choice feel forced.",
  move:"Close the page, check the sale’s real end date, and return to your own comparison.",
  s1:{ o:['inertia','urgency','sunk'], a:1, why:{ inertia:"Nothing is sliding. There is a clock working on you right now.", sunk:"You have not put money or effort into this sofa. The timer is the pull." } },
  s2:{ o:["Ask friends whether the sofa is a good buy (direct question).","Read the retailer’s sale terms page to see when the price actually ends (official page).","Read reviews of the sofa (reviews).","Buy it and rely on the returns policy (no source)."], a:1,
    why:["Friends can judge the sofa. They cannot tell you whether the price is really ending.",null,"Reviews test the sofa’s quality. They say nothing about whether the deadline is real.","This acts under the timer and assumes a returns policy you have not read."] },
  s3:{ o:["Buy now while the clock runs.","Close the page, wait 24 hours, then compare against your three-shop list.","Buy now and plan to return it if the comparison goes badly."], a:1,
    why:["This lets a countdown replace the comparison you planned.",null,"This still buys under the timer, and a return costs effort and may cost money."] },
  h:["Whose clock is running: yours, or the site’s?","Look for the check that tells you when the price really ends, from the seller’s own page.","Choose the option that returns the decision to your own comparison."],
  worked:"Observation: a countdown and “only 2 left” arrive at 11:50 pm, against a plan you made on Sunday. Meaning: the timer is the seller’s tool, and your analysis still stands. Action: read the sale terms for the real end date, close the page, and compare against your three-shop list." },

{ id:'U2', p:'urgency', l:1, cat:'Purchases', title:'Tonight only',
  text:"A broadband salesperson knocks at 6 pm, while your pasta is boiling over, and says the £22-a-month offer “ends tonight at midnight”. It needs a 24-month contract and a £60 set-up fee. Your analysis, made last week: you pay £29 a month on a 12-month plan with no set-up fee, and you have not yet compared other providers.",
  signal:"“Ends tonight at midnight”: a deadline set by the seller, at your door.",
  move:"Ask for the offer in writing, work out the total cost, and check the provider’s own page.",
  s1:{ o:['urgency','instruction','phantom'], a:0, why:{ instruction:"Nobody is telling you what to do beyond selling to you. The pull is the deadline.", phantom:"No rule or limit is being claimed. A timer is." } },
  s2:{ o:["Ask the salesperson whether the offer really ends tonight (direct question).","Sign now and read the contract afterwards (no source).","Look up the offer on the provider’s website and read the contract length and fees (official page).","Ask a neighbour whether they use this provider (direct question)."], a:2,
    why:["The seller benefits from your answer, so the answer is not a check.","This acts before checking anything.",null,"A neighbour’s experience does not show what this offer says."] },
  s3:{ o:["Sign tonight.","Sign tonight, then ask for a lower price.","Say you will decide tomorrow, ask for the offer in writing, and compare the 24-month total with other providers."], a:2,
    why:["This lets the deadline decide.","This adds a second unchecked step to the first.",null] },
  h:["Who set the deadline, and who benefits from it?","One check is the provider’s own page, not the person at your door.","Choose the option that gives you a written offer and a comparison."],
  worked:"Observation: a same-night deadline, a 24-month term and a £60 fee arrive together, at your door. Meaning: the deadline is the seller’s, and the real cost over 24 months (24 × £22 + £60 = £588) needs comparing, not accepting. Action: ask for the offer in writing, check the provider’s page, and compare with other providers." },

{ id:'U3', p:'urgency', l:2, cat:'Relationships and lifestyle money', title:'The last rooms',
  text:"You and your partner Asha are planning a long weekend in Lisbon in October. A booking page says “Only 2 rooms left at this price” beside a £215-a-night room, with “free cancellation” in small grey type followed by an asterisk. Your shared budget allows £150 a night, and you planned to book about a week before. Asha texts, “These will go, book it!” The price has been the same since you first looked on Tuesday. You have not looked at any other site.",
  signal:"“Only 2 rooms left”: scarcity, with a friendly push behind it, working against a budget you set.",
  move:"State your limit, check the small print and the hotel’s own site, and let the comparison decide.",
  s1:{ o:['instruction','urgency','phantom'], a:1, why:{ instruction:"Asha’s text is a nudge from an equal, not an instruction from someone you defer to. The pull is “these will go”.", phantom:"You are not assuming a limit. You are reacting to a scarcity message." } },
  s2:{ o:["Ask Asha how likely she thinks the rooms are to sell out (direct question).","Book the room and cancel later if needed (no source).","Read the asterisked cancellation terms on the booking page, then look at the hotel’s own site for the same dates (official page).","Read a forum thread about the booking site (forum posts)."], a:2,
    why:["Asha’s guess about availability is the same “these will go” claim.","This acts on the pull first and relies on a small print you have not read.",null,"A forum shows what happened to other people, and not whether these rooms are limited or refundable."] },
  s3:{ o:["Book the £215 room now, with free cancellation, and look at other sites later.","Tell Asha your £150 limit, and check the hotel’s own site and two other sites today before you book anywhere.","Ask Asha to book it on her card, so you can settle the cost between you later."], a:1,
    why:["This is a hedge, and hedges can be reasonable. But it books £65 above your limit on a scarcity message, and you would have to remember to cancel by 3 October.",null,"This hands the booking to the scarcity pull and turns the budget question into a debt between the two of you."] },
  h:["What did you decide before the scarcity message appeared?","One check is in the small print; another is the hotel’s own site for the same dates.","Choose the option that returns to your own budget and comparison."],
  worked:"Observation: a scarcity message, a friendly push and small print, against a £150 limit you set. Meaning: the message may be true, but it has not been checked, and the price has been unchanged since Tuesday. Action: read the asterisked terms, check the hotel’s site and two others, and book only within your limit." },

{ id:'U4', p:'urgency', l:3, cat:'Tenancy and contracts', title:'The other applicant',
  text:"The letting agent, Callum, rings while you queue for a train and says, “Another couple are ready to pay the holding deposit now, so I need £500 from you within the hour or the flat goes.” You had planned to view a second flat on Thursday, and to read the tenancy agreement before paying anything. Callum adds, “It’s all standard, the holding deposit is non-refundable, everyone knows that.” The flat has a lovely tiled hallway.",
  signal:"“Within the hour or the flat goes”: a clock from someone who benefits, with “everyone knows that” alongside.",
  move:"Ask for the terms in writing, keep your own plan, and reply once you have read them.",
  s1:{ o:['phantom','urgency','sunk','instruction'], a:1, alt:'phantom',
    altNote:"Phantom Constraint is also defensible: “non-refundable, everyone knows that” asserts a limit nobody has shown you. The worked answer is Urgency Grab, because the “within the hour” deadline drives the whole call.",
    why:{ phantom:"Accepted as a defensible alternative.", sunk:"You have not paid or committed anything yet. Nothing spent is being defended.", instruction:"Callum is pressing you, but the pull is the clock and the rival, not deference to his authority." } },
  s2:{ o:["Ask Callum whether the other couple is real (direct question).","Look up reviews of the agency (reviews).","Ask Callum to send the holding-deposit terms in writing, and say you will reply once you have read them (contract text).","Pay the deposit and read the terms afterwards (no source)."], a:2,
    why:["You cannot check that, and Callum benefits from your answer.","Reviews of the agency are slower than the terms themselves, and do not tell you what this deposit covers.",null,"This acts under the clock and pays before checking what is refundable."] },
  s3:{ o:["Pay £500 now to secure the flat.","Ask for another hour and decide then.","Say you will reply after reading the terms in writing, and keep Thursday’s viewing."], a:2,
    why:["This lets the clock and the rival decide.","This stays inside Callum’s deadline. It does not change the question.",null] },
  h:["Who benefits if you answer within the hour?","The check is the written terms of the holding deposit, not what “everyone knows”.","Choose the answer that keeps your own plan for Thursday."],
  worked:"Observation: a one-hour deadline, a rival couple and “non-refundable, everyone knows that” arrive in one call. Meaning: the clock is the strongest pull; the non-refundable claim is a second thing to check. Action: ask for the terms in writing, keep Thursday’s viewing, and reply after reading them." },

{ id:'D1', p:'inertia', l:1, cat:'Admin processes', title:'The renewal',
  text:"Your car insurance renews automatically on 14 October at £612. Last year you paid £498, and a comparison site you opened once in July showed three cheaper quotes that you did not save. The renewal email has sat in your inbox since 23 September, above a newsletter from a garden centre. You have thought “I should sort that” on six separate evenings.",
  signal:"“I should sort that”, six times, with no date: the default is quietly being chosen.",
  move:"Put a dated slot in your calendar for the first step, and make the choice inside it.",
  s1:{ o:['urgency','inertia','phantom'], a:1, why:{ urgency:"The renewal date is real, but you have had three weeks and nothing rushed you. The pattern is that no start date was ever set.", phantom:"Nobody has claimed a rule stops you switching. The problem is that you have not looked." } },
  s2:{ o:["Ask a colleague which insurer they use (direct question).","Get three fresh quotes for the same cover and read the renewal’s cancellation terms (official pages).","Wait until 13 October to see whether the price changes (no source).","Check what you paid last year (your own records)."], a:1,
    why:["A colleague’s insurer is not a quote for your car and cover.",null,"This leaves the default in place and shortens your time to act.","You already know last year’s price. It does not tell you what is available now."] },
  s3:{ o:["Let it renew and compare next year.","Put a 20-minute slot in your calendar for tomorrow evening: get the quotes, choose, and swap or cancel before 14 October.","Renew now to be safe."], a:1,
    why:["This chooses the default for another year, and £114 more than last year.",null,"This is the default again, presented as caution."] },
  h:["When exactly will you start? Is there a date in your calendar?","The check is fresh quotes for the same cover, and the terms for stopping the renewal.","Choose the option that puts the decision on a date."],
  worked:"Observation: six evenings of “I should sort that” with no date attached, and a renewal that costs £114 more than last year. Meaning: with no date, the default renews itself. Action: book a dated 20-minute slot, get three quotes for the same cover, and swap or cancel before 14 October." },

{ id:'D2', p:'inertia', l:1, cat:'Salary and praise', title:'The conversation that never happens',
  text:"You have meant to ask your manager, Ines, for a development conversation since March. It is now the second week of November. The calendar invite you drafted in April still sits in your drafts under a photo of a lemon tree. Your analysis: you want a stretch project, and a review of your pay before the January budget is set. You tell yourself that “the timing is never quite right”.",
  signal:"“The timing is never quite right”: a task with no date, still sliding after eight months.",
  move:"Send the request today, for a slot within a fortnight, with two lines on what you want.",
  s1:{ o:['inertia','urgency','instruction'], a:0, why:{ urgency:"The January budget is a soft date and nobody has pressed it on you. The problem is that you never set a date of your own.", instruction:"Nobody has told you to wait or to act. The delay is your own." } },
  s2:{ o:["Ask a colleague whether now is a good time (direct question).","Re-read your April draft (your own notes).","Check Ines’s calendar for gaps and the finance page for the budget cut-off date (official page).","Wait for Ines to raise it (no source)."], a:2,
    why:["A colleague’s view of “a good time” is the same vague timing that has held you back.","You already know what it says. It has been sitting there since April.",null,"This leaves the decision with the default."] },
  s3:{ o:["Wait for a calmer week.","Send the invite today for a slot in the next fortnight, with two lines on what you want.","Mention it in passing next time you see Ines."], a:1,
    why:["“A calmer week” has not arrived since March.",null,"A passing mention has no date and no agenda, so it slides again."] },
  h:["What is the date you have set for this? If none, that is the pattern.","Check when Ines is free and when the budget closes.","Choose the option with a date, an agenda and a send button."],
  worked:"Observation: eight months, one unsent draft, and “the timing is never quite right”. Meaning: a task with no date slides, and the default is that it never happens. Action: check Ines’s calendar and the budget date, then send the invite today for a slot inside two weeks." },

{ id:'D3', p:'inertia', l:2, cat:'Relationships and lifestyle money', title:'The savings pot',
  text:"Your joint savings account with your partner, Noor, holds £6,400 and pays almost nothing. You opened it in 2021 with a £50 welcome bonus, and nobody has opened the app since Noor’s birthday. You have both said “we should do something with that” over dinner at least twice, each time while the waiter was topping up the water. The latest statement has a banner saying “Rates may change soon”, with no date. Noor says it would feel wrong to “just abandon” the account.",
  signal:"“We should do something with that”, twice at dinner, with no date: nobody has chosen, so the account has.",
  move:"Book a dated 30 minutes together, check the terms, compare two accounts, and move the money by a set day.",
  s1:{ o:['urgency','sunk','inertia','phantom'], a:2, why:{ urgency:"The banner says rates “may change soon” but gives no date, and nothing forces a decision. The pull is that nothing forces one.", sunk:"The £50 bonus is a small past benefit. The main pattern is not defending it but never choosing.", phantom:"Nobody has claimed a rule stops you moving the money. The problem is that no one has looked." } },
  s2:{ o:["Ask Noor what she remembers about the fees (direct question).","Search for the best savings rates (search results).","Read the account’s terms on the bank’s website for withdrawal and transfer fees (official page).","Wait for the date on the banner (no source)."], a:2,
    why:["Noor’s memory of the terms is not the terms.","Useful for choosing a new account, but it does not check whether this one has exit costs.",null,"The banner has no date, so this waits for nothing in particular."] },
  s3:{ o:["Keep it as it is until the rates change.","Move all £6,400 to the first account that appears in a search.","Book 30 minutes together this Sunday to check the terms, compare two accounts, and move the money by the end of the month."], a:2,
    why:["This waits on a date nobody has set. The default stays.","This makes a choice with no comparison, in a hurry to end the drift.",null] },
  h:["Who decided that this money should sit where it is? When?","The check is the account’s own terms, not what either of you remembers.","Choose the option that gives the choice a date and both of you a seat."],
  worked:"Observation: two dinners of “we should do something”, an unopened app, and a banner with no date. Meaning: no one has chosen, so the current account is the choice by default, and the small bonus is not what holds you. Action: set a dated 30 minutes with Noor, read the terms, compare two accounts, and move the money by the end of the month." },

{ id:'D4', p:'inertia', l:3, cat:'Admin processes', title:'The default fund',
  text:"In your second week at a new firm, the onboarding portal shows your pension set to “Default fund, minimum contribution”. A line in the HR welcome email reads, “Most people just leave the default, and we recommend it.” Your notes from the pension explainer you read on the train say: pay in more than the minimum and check the fund’s fees. Changes are possible at any time, and nobody has given a date. There is a plant on every desk in the office except yours.",
  signal:"“Most people just leave the default, and we recommend it”: the default is being offered as the choice, with HR’s authority behind it.",
  move:"Compare the default with one alternative on fees, decide, and set a date to change the contribution.",
  s1:{ o:['instruction','inertia','phantom','urgency'], a:1, alt:'instruction',
    altNote:"Instruction Compliance is also defensible: “we recommend it” is a recommendation from an authority. The worked answer is Inertia Drift, because the real risk is that the default stays because no one, including you, sets a date to decide.",
    why:{ instruction:"Accepted as a defensible alternative.", phantom:"Nobody says you cannot change the fund. The email says most people do not.", urgency:"There is no deadline in this story, and that is part of the problem." } },
  s2:{ o:["Ask HR whether most people leave the default (direct question).","Ask a colleague which fund they picked (direct question).","Leave it and look at it in a year (no source).","Read the default fund’s fee sheet and the plan rules on the pension provider’s page (official page)."], a:3,
    why:["HR has already told you. That is the default’s own account of itself.","A colleague’s choice reflects their circumstances, not yours.","This lets the default run and sets no date for looking.",null] },
  s3:{ o:["Leave the default, as HR recommends.","Pick whichever fund a colleague chose.","Compare the default fund’s fees with one alternative, choose, and set the contribution before the end of the month."], a:2,
    why:["This accepts the default, which is exactly what your notes said to check.","This borrows someone else’s choice without checking it against your own notes.",null] },
  h:["Whose choice is “default fund, minimum contribution” right now: yours, or nobody’s?","The check is the fee sheet and the plan rules, from the provider.","Choose the option that sets a date for your own decision."],
  worked:"Observation: the default is set, HR recommends it, and no date exists for anything. Meaning: the status quo becomes your choice unless you choose; “most people” describes the default, not your notes. Action: read the fee sheet and plan rules, compare one alternative, and set your contribution before the end of the month." }
];
const SCEN = id => SCENARIOS.find(s => s.id === id);
const PLACEMENT_ITEMS = ['I1','S1','P1','U1','D1'];   // the first L1 item of each pattern

/* ================================================================
   2c. LEARN — one card per idea; every card has the parts listed in the spec
   ================================================================ */
const LEARN = [
{ id:'decision-point', kind:'intro', title:'Recognising a decision point', blurb:'The cues that show a choice is being made, and why noticing comes first.',
  parts:[
    { h:'What it is', p:["A decision point is any moment when a choice is being made, whether or not it feels like one. Many defaults happen because the moment is never noticed as a choice."] },
    { h:'The cues', ul:["An instruction you didn’t set. Someone tells you what to do, or what the form says, and you find yourself doing it.","A deadline someone else imposed. “By Friday”, “within the hour”, “today only”.","“We’ve already put in…”. Money, time or effort already spent is being used as a reason.","A price with a timer. A countdown, or “only 2 left”.","A task with no date that keeps sliding. You have said “I should sort that” more than once."] },
    { h:'Why noticing comes first', p:["You cannot use a counter-move on a choice you have not noticed. Everything else in this tool starts from this step: Quick Checkpoint begins with “Which pull is this?”, and “Not sure” shows these same cues."] },
    { h:'What to do when you notice one', p:["Tell yourself “this is a decision point”. Then open Quick Checkpoint (three screens, under a minute), or the full Checkpoint if you have ten minutes."] }
  ] },
{ id:'p-instruction', kind:'pattern', pattern:'instruction', title:'Instruction Compliance', blurb:'Following the first or most authoritative instruction without checking it against your own analysis.',
  parts:[
    { h:'What it is', p:["You follow the first instruction you were given, or the one from whoever has authority, without checking it against your own analysis."] },
    { h:'Why people fall into it', p:["An instruction arrives with authority attached, and it arrives first. Once it is on the table, following it can start to feel like the default, and departing from it like a challenge. Your own analysis was made earlier, alone, and has no voice in the room. So an instruction can win by being present, not by being right."] },
    { h:'Tell-tale signs', ul:["Phrases: “Just put…”, “That’s how it’s done”, “It’s the standard one”, “Everyone does it this way”.","Thoughts: “It would be awkward to question it”, “They must know better”, “I’ll sort it out afterwards”."] },
    { h:'The counter-move', p:["Before you act, read your own analysis line aloud. Then ask what the instruction knows that your analysis does not. If the answer is “a real rule”, find where the rule is written. If the answer is “nothing”, hold to your analysis and say so in one sentence."] },
    { h:'Example if-then cues', cues:true },
    { h:'Worked example', ol:["Situation: a garage receptionist says, “Just sign the work order, it covers everything.” You had agreed to an inspection only, up to £60.","Notice: an instruction you did not set (“just sign”), with no reason attached.","Your analysis said: authorise the inspection only.","Check (15 minutes): read the work order’s wording. Does it authorise repairs? Source: contract text.","Choose: cross out the repair line and sign for the inspection only.","Commit: “I will sign for the inspection only and refuse open-ended repairs.” (11 words)"] }
  ] },
{ id:'p-sunk', kind:'pattern', pattern:'sunk', title:'Sunk Cost Loyalty', blurb:'Continuing because of what is already spent, not because of what comes next.',
  parts:[
    { h:'What it is', p:["You keep going with something because of what you have already put in (money, time, effort), not because of what it will give you from here."] },
    { h:'Why people fall into it', p:["Stopping can feel like admitting the earlier spending was wasted, so continuing can feel like protecting it. But money already spent is the same whichever way you choose, so it cannot help you choose. Studies of the sunk cost effect (Arkes and Blumer) found, for example, that theatre-goers who paid full price for season tickets attended more of the early performances than those who had been given a discount."] },
    { h:'Tell-tale signs', ul:["Phrases: “We’ve already put in…”, “I’ve paid for it, so…”, “After all this time…”, “It would be a waste to stop.”","Thoughts: “I can’t stop now”, “I need to get my money’s worth”, “I’ll look silly if I quit”."] },
    { h:'The counter-move', p:["Write down what each option gives you from today onward, and compare only that. Ask: “If I had paid nothing so far, which would I choose?” Then choose that."] },
    { h:'Example if-then cues', cues:true },
    { h:'Worked example', ol:["Situation: you have paid £120 for a photography course and been to two of eight sessions. The drive takes an hour each way.","Notice: “I’ve already paid”.","Your analysis said: you would learn more by practising at home.","Check (15 minutes): read the course’s refund and transfer terms. Source: official page.","Choose: compare from today: six more long drives against practising at home. Drop the course, and ask for a transfer or partial refund if the terms allow.","Commit: “I will drop the course and practise at home, and ask for a partial refund.” (15 words)"] }
  ] },
{ id:'p-phantom', kind:'pattern', pattern:'phantom', title:'Phantom Constraint', blurb:'Obeying a rule, limit or requirement you have not checked exists.',
  parts:[
    { h:'What it is', p:["You treat a rule, limit or requirement as fixed without checking that it exists at its source."] },
    { h:'Why people fall into it', p:["A belief about a rule costs nothing to hold, and it often arrives second-hand: from a friend, a colleague, a half-remembered page. Once you believe it, the choice can feel already made, so the belief often goes untested. Checking takes minutes; being wrong about a rule can cost months."] },
    { h:'Tell-tale signs', ul:["Phrases: “I can’t, because of the rules”, “Company policy”, “That’s just how it works”, “I’m locked in”.","Thoughts: “There’s no point asking”, “Someone would have told me”, “I’m sure it says that somewhere”."] },
    { h:'The counter-move', p:["Write the constraint as a sentence. Name where it would be written (contract text, an official page, or the person who decides). Spend 15 minutes reading it or asking. Only then decide."] },
    { h:'Example if-then cues', cues:true },
    { h:'Worked example', ol:["Situation: you want to move to an earlier train, and you assume “this ticket can’t be changed”.","Notice: “can’t” with no source.","Your analysis said: an earlier train would save an hour.","Check (15 minutes): read the ticket conditions on the operator’s page. Source: official page.","Choose: if changes are allowed before travel, change it; if not, weigh the fee against the hour.","Commit: “I will change to the earlier train if the conditions allow it.” (12 words)"] }
  ] },
{ id:'p-urgency', kind:'pattern', pattern:'urgency', title:'Urgency Grab', blurb:'Taking the fast option because someone else’s clock makes it feel like the only one.',
  parts:[
    { h:'What it is', p:["You take the fast option because someone else’s deadline or a timer makes it feel like the only one."] },
    { h:'Why people fall into it', p:["A deadline can make it feel as though there is no time to check, so people often decide with what is in front of them. The person who set the clock often benefits from a quick answer, and the fast option often quotes a small monthly price, which hides its total."] },
    { h:'Tell-tale signs', ul:["Phrases: “Ends tonight”, “Only 2 left”, “I need an answer within the hour”, “Another buyer is ready”.","Thoughts: “I’ll lose it if I wait”, “Better safe than sorry”, “I can always cancel later”."] },
    { h:'The counter-move', p:["Ask who set the deadline and what actually happens if you decide tomorrow. Price the fast option over 12 months. Then wait, or get the offer in writing, before you answer."] },
    { h:'Example if-then cues', cues:true },
    { h:'Worked example', ol:["Situation: a shop assistant says a phone deal “ends on Sunday”. It is £38 a month for 12 months with no upfront cost. Another offer is £30 a month with £120 upfront.","Notice: a deadline someone else imposed.","Your analysis said: compare before buying.","Check (15 minutes): read the shop’s terms page for the real end date. Then work out the totals: 12 × £38 = £456; 12 × £30 + £120 = £480.","Choose: on these numbers the first offer is £24 cheaper over 12 months, so take it, after the terms confirm it. If the date turned out to be false, wait a week.","Commit: “I will take the £38 deal once the terms confirm it.” (11 words)"] }
  ] },
{ id:'p-inertia', kind:'pattern', pattern:'inertia', title:'Inertia Drift', blurb:'Letting a task or choice with no date slide, so the current state becomes the decision.',
  parts:[
    { h:'What it is', p:["You let a task or decision with no date slide, so the current state becomes the choice by default."] },
    { h:'Why people fall into it', p:["Nothing forces the choice, and doing nothing feels like not choosing. But doing nothing is a choice: it keeps the current option. Studies of status quo bias (Samuelson and Zeckhauser) found that, on average, people tended to stay with an option presented as the current one, including in real choices such as health plans."] },
    { h:'Tell-tale signs', ul:["Phrases: “I should sort that”, “I’ll get round to it”, “The timing isn’t right”, “Most people just leave it”.","Thoughts: “It’s fine for now”, “I’ll deal with it when it renews”, “There’s no rush”."] },
    { h:'The counter-move', p:["Put the first step in your calendar with a date, then and there. Make the choice inside that slot, not before it."] },
    { h:'Example if-then cues', cues:true },
    { h:'Worked example', ol:["Situation: your broadband price rises in six weeks. You have thought “I should look at that” three times.","Notice: a task with no date that keeps sliding.","Your analysis said: compare providers before the rise.","Check (15 minutes): get two quotes for the same speed and read the exit terms. Source: official pages.","Choose: switch if a quote saves more than the exit fee; otherwise call your provider and ask for a better price.","Commit: “I will compare two quotes on Saturday and switch or renegotiate.” (11 words)"] }
  ] },
{ id:'m-ifthen', kind:'method', title:'If-then planning', blurb:'Deciding your response in advance: “If [cue], then I will [action]”.',
  parts:[
    { h:'What it is', p:["A plan in the form “If [cue], then I will [counter-move]”, written before the moment arrives."] },
    { h:'Why it works', p:["Studies of implementation intentions (Gollwitzer) found that, on average, people who decide in advance “if this cue, then this action” follow through on their goals more often than people who only set the goal. One common explanation is that the plan links a situation to a response, so the situation itself prompts the action and you do not have to remember to be careful."] },
    { h:'How to do it in under a minute', ol:["Name a cue you could see or hear, such as “the agent says ‘sign today’”.","Write one concrete action, such as “ask for the terms in writing”.","Check it names which pattern it guards against."] },
    { h:'Example', p:["“If the salesperson says ‘the offer ends tonight’, then I will ask for it in writing and multiply the monthly price by 12.” It guards against Urgency Grab."] },
    { h:'Check your understanding', check:{ q:"Which of these is an if-then plan?", o:["“I will try to be more careful with contracts.”","“If the agent says ‘sign today’, then I will ask for the terms in writing and read the term clause.”","“I hope I don’t panic under pressure.”"], a:1, why:"It has a cue you could see or hear, and one concrete action. The others state an intention or a hope, with no cue and no action." } }
  ] },
{ id:'m-contrast', kind:'method', title:'Mental contrasting', blurb:'Picture the outcome you want, then the obstacle inside you.',
  parts:[
    { h:'What it is', p:["Picturing the outcome you want, then the obstacle inside you that could get in the way (Oettingen). Prepare uses it: step 2 is the outcome, step 3 is the pull."] },
    { h:'Why it works', p:["In a number of studies, people who pictured a wanted outcome and then the obstacle inside them tended, on average, to put in effort that matched how likely they judged success to be. Picturing only the outcome did not do this. The obstacle gives your plan something specific to guard against."] },
    { h:'How to do it in under a minute', ol:["Write the outcome you want in one line.","Name the pull inside you that is most likely to get in the way (one of the five patterns).","Write an if-then plan for that pull."] },
    { h:'Example', p:["Outcome: “keep the 12-month term with a break clause.” Obstacle: “when the agent says ‘it’s standard’, I tend to sign”. Plan: “If the agent says ‘standard’, then I will ask for the break clause in writing.”"] },
    { h:'Check your understanding', check:{ q:"In mental contrasting, what comes after picturing the outcome you want?", o:["Picturing the obstacle inside you that could get in the way.","Deciding that success is guaranteed.","Waiting to see what happens."], a:0, why:"The method pairs the wanted outcome with the obstacle inside you. Picturing only the outcome leaves the plan with nothing to guard against." } }
  ] },
{ id:'m-premortem', kind:'method', title:'Premortem', blurb:'Imagine the choice has already failed, then say why.',
  parts:[
    { h:'What it is', p:["Imagining that the choice has already failed, then explaining why (Klein). Checkpoint step 6 asks: “Six months on, this choice failed. Why?”"] },
    { h:'Why it works', p:["This is a practitioner technique, and this tool uses it as practice, not as a tested result. The rationale Klein gives is that once a failure is imagined as having happened, it is easier to say the doubts you would otherwise keep quiet."] },
    { h:'How to do it in under a minute', ol:["Say: “Six months on, this choice failed.”","Write one line on the most likely reason.","If the reason is something you could check now, add it to your verification step."] },
    { h:'Example', p:["“Six months on, the 24-month contract failed. Why? I moved for work and could not leave.” That reason points to checking the exit terms before signing."] },
    { h:'Check your understanding', check:{ q:"Which is a premortem question?", o:["“Six months on, this choice failed. Why?”","“How will I celebrate when this goes well?”","“What does everyone else usually do?”"], a:0, why:"A premortem assumes failure has already happened and asks for the reason. The others ask about success or about what others do." } }
  ] },
{ id:'m-verify', kind:'method', title:'Verifying at source', blurb:'Checking an assumed constraint where it is actually written.',
  parts:[
    { h:'What it is', p:["Checking an assumed constraint at its source: the contract text, the official page, or a direct question to the person who can decide."] },
    { h:'Why it works', p:["This is practical reasoning, not a research finding. A belief about a rule costs nothing to hold and can cost a lot to obey. A check costs minutes. Second-hand sources (friends, forums, “everyone knows”) tell you what people believe, not what is written."] },
    { h:'How to do it in under a minute', ol:["Write the constraint as one sentence.","Name the source: contract text, official page, or a direct question to the decider.","Choose one action you can finish in 15 minutes."] },
    { h:'Example', p:["Constraint: “I can’t leave my mobile contract early.” Source: the contract text. Action: open the PDF and read the early-termination section."] },
    { h:'Check your understanding', check:{ q:"Which is verifying at source?", o:["Asking a friend who once had the same kind of contract.","Reading the early-termination section of your own contract.","Searching a forum for other people’s experiences."], a:1, why:"Only the contract states what applies to you. A friend’s experience and forum posts show what happened to other people." } }
  ] },
{ id:'m-cost12', kind:'method', title:'12-month total cost', blurb:'Pricing the fast option over a year before you decide.',
  parts:[
    { h:'What it is', p:["The recurring cost multiplied by the months, plus any one-off cost: recurring × months + one-off. Checkpoint step 5 has a calculator for it."] },
    { h:'Why it works', p:["This is arithmetic, not a research finding. Monthly prices are quoted because they look small; multiplying shows the size of the commitment, and putting a one-off cost beside it makes the two options comparable."] },
    { h:'How to do it in under a minute', ol:["Write the monthly cost and the number of months.","Multiply, then add any set-up or one-off fee.","Set the total beside the other option’s total."] },
    { h:'Example', p:["£19.99 a month for 12 months plus a £45 set-up fee: 12 × £19.99 = £239.88, plus £45 = £284.88."] },
    { h:'Check your understanding', check:{ q:"£24 a month for 12 months, plus a £60 set-up fee. What is the 12-month total?", o:["£84","£288","£348"], a:2, why:"12 × £24 = £288, and £288 + £60 = £348. £288 leaves out the set-up fee, and £84 adds only one month." } }
  ] },
{ id:'m-horizon', kind:'method', title:'Time-horizon framing', blurb:'Looking at a choice from 10 minutes, 10 months and 10 years away.',
  parts:[
    { h:'What it is', p:["Asking how a choice will look in 10 minutes, in 10 months and in 10 years. It is a popular practitioner technique."] },
    { h:'Why it works', p:["This is practitioner practice, and this tool uses it as practice, not as a tested result. The idea is that pressure shrinks your view to the next few minutes, and looking further out restores the longer view."] },
    { h:'How to do it in under a minute', ol:["Write one line for how it will feel in 10 minutes.","Write one line for 10 months.","Write one line for 10 years. If the three lines disagree, the disagreement is the thing to look at."] },
    { h:'Example', p:["Buying the sofa tonight: 10 minutes, relief. 10 months, a bigger bill than planned. 10 years, forgotten either way. The long lines suggest waiting."] },
    { h:'Check your understanding', check:{ q:"Which set of distances is used in time-horizon framing here?", o:["10 minutes, 10 months, 10 years.","1 hour, 1 week, 1 month.","10 seconds, 10 days, 100 years."], a:0, why:"The three distances are 10 minutes, 10 months and 10 years." } }
  ] },
{ id:'m-commit', kind:'method', title:'The commitment sentence', blurb:'One short sentence that names your choice and the default you are overriding.',
  parts:[
    { h:'What it is', p:["One sentence, under 20 words, that names the option you are choosing and the default you are overriding."] },
    { h:'Why it works', p:["This is a design choice in this tool, not a research finding. Writing one short sentence forces a choice and makes the default explicit. The word count is scored by the app; whether it names the option and the default is your own judgement."] },
    { h:'How to do it in under a minute', ol:["Start with “I will…” and name the option.","Add what you are declining: the default you are overriding.","Count the words. Under 20 passes the app’s check."] },
    { h:'Example', p:["“I will take the 12-month plan and decline the 24-month contract.” That is 11 words. It names the option (12-month plan) and the default (24-month contract)."] },
    { h:'Check your understanding', check:{ q:"Which sentence passes the app’s word-count check?", o:["“I will take the 12-month plan and decline the 24-month contract.”","“I have thought about this at length, and having considered every angle I will, on balance, most probably take the twelve-month plan and probably decline the twenty-four-month contract.”","“Maybe.”"], a:0, why:"The first has 11 words, which is under 20. The second is well over 20. “Maybe” is under 20 but names no option and no default; that part you would judge yourself." } }
  ] },
{ id:'moments', kind:'guide', title:'The three moments', blurb:'Before a decision, during one, and after a miss.',
  parts:[
    { h:'What each one is for', ul:["Prepare (before): when you know a decision is coming. You write down what your analysis recommends, which pull is most likely to get you, and if-then plans, so the response is chosen before the pressure arrives.","Quick Checkpoint (during, under a minute): when you are in the decision now. Three screens: which pull it is, what your analysis said, and one commitment sentence.","Checkpoint (during, ten minutes): when there is time. It adds the check on the assumed constraint, the 12-month cost, the premortem and a follow-up date.","Autopsy (after): when you have already defaulted. You record what happened, what was skipped and what it cost, then write an if-then plan for next time."] },
    { h:'How to choose', p:["Facing a decision right now: Quick Checkpoint. Ten minutes and a decision in front of you: Checkpoint. Something coming up: Prepare. Something already missed: Autopsy. Drills are the gym, and they never stand in the way of any of these."] },
    { h:'What gets saved', p:["Each one saves an entry to the Log. Entries are counted as live entries, per pattern and per type, separately from drill accuracy. An Autopsy is marked retrospective, and counts as progress in recognition, not as failure."] }
  ] },
{ id:'measure', kind:'measure', title:'How this tool measures you', blurb:'First attempts, the rolling window, levels, what the app scores, and what you report.',
  parts:[

/* Pattern names inside running text become tappable, wherever they appear. */
const NAME_RE = new RegExp('(' + PKEYS.map(k => PATTERNS[k].name).join('|') + ')');
const KEY_OF_NAME = {}; PKEYS.forEach(k => KEY_OF_NAME[PATTERNS[k].name] = k);
const NO_LINK = 'button,a,label,select,option,textarea,input,.mark,.plink,script,style,h1,legend,[data-nolink],.dialog>h2';
function linkify(root){
  if(!root || root.nodeType !== 1 || root.closest(NO_LINK)) return;
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n => NAME_RE.test(n.nodeValue) && !n.parentElement.closest(NO_LINK) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(NAME_RE).forEach((part, i) => {
      if(i % 2 === 1){ const k = KEY_OF_NAME[part]; frag.append(h('button',{type:'button', class:'plink', 'data-pattern':k, onclick:() => openPatternDef(k)}, part)); }
      else if(part) frag.append(document.createTextNode(part));
    });
    n.replaceWith(frag);
  });
}
new MutationObserver(ms => { ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1) linkify(n); })); }).observe(document.body, { childList:true, subtree:true });

/* ================================================================
   6. FLOW ENGINE — Prepare, Quick Checkpoint, Checkpoint, Autopsy
   ================================================================ */
const FLOWS = {};
function flowScreen(def, main){
  const key = def.key;
  let d = state.drafts[key];
  if(!d){ d = { step:0, data:def.init(), startedAt:iso(), at:iso() }; state.drafts[key] = d; persist(); }
  d.step = Math.max(0, Math.min(d.step, def.steps.length-1));
  const wrap = h('div',{class:'flow stack-l'});
  const api = { changed(){ d.at = iso(); persistSoon(); } };
  main.replaceChildren(wrap);

  function draw(moveFocus){
    const step = def.steps[d.step], last = d.step === def.steps.length-1;
    const err = h('p',{class:'problem', role:'alert', hidden:true, 'data-test':'problem'});
    const head = h('h1',{id:'step-h', tabindex:'-1', class:def.live ? 'live' : ''}, step.heading(d.data));
    const body = step.render(d.data, api);
    function fail(bad){
      err.textContent = bad.msg; err.hidden = false;
      const t = bad.focus ? wrap.querySelector(bad.focus) : null;
      if(t){ t.setAttribute('aria-invalid','true'); t.focus(); } else { err.setAttribute('tabindex','-1'); err.focus(); }
    }
    function advance(){
      const bad = step.check ? step.check(d.data) : null;
      if(bad) return fail(bad);
      if(step.onNext) step.onNext(d.data);
      if(last) return finish();
      d.step++; d.at = iso(); persist(); draw(true);
    }
    wrap.replaceChildren(h('div',{class:'step stack-l'},
      h('div',{class:'stack'}, h('p',{class:'progress num'}, def.name+' · Step '+(d.step+1)+' of '+def.steps.length), head, step.hint ? h('p',{class:'lead'}, step.hint) : null),
      body, err,
      h('div',{class:'row actions'},
        d.step > 0 ? h('button',{type:'button', class:'btn big', 'data-act':'back', onclick:() => { d.step--; persist(); draw(true); }}, 'Back') : null,
        h('button',{type:'button', class:'btn primary big', 'data-act':'next', onclick:advance}, last ? def.saveLabel : 'Next')),
      h('div',null, h('button',{type:'button', class:'btn quiet', 'data-act':'discard', onclick:async () => {
        if(await confirmDialog({ title:'Discard this draft?', body:'Everything you have typed in this '+def.name.toLowerCase()+' will be removed. Nothing is added to the Log.', confirmLabel:'Discard draft', cancelLabel:'Keep draft' })){
          state.drafts[key] = null; delete state.drafts[key]; persist(); location.hash = '#/home';
        }
      }}, 'Discard draft'))));
    window.scrollTo(0,0);
    if(moveFocus){ head.focus(); announce(def.name+', step '+(d.step+1)+' of '+def.steps.length+'. '+head.textContent); }
    else head.focus({preventScroll:true});
  }
  function finish(){
    const entry = def.save(d.data);
    state.drafts[key] = null; delete state.drafts[key]; persist();
    const done = def.done(entry);
    if(state.entries.length === 1 && !state.attempts.length) done.append(h('p',{class:'notice', 'data-test':'gym-note'},'Drills are the gym for these moves. Open Train when you have a spare few minutes; live decisions always come first.'));
    const head = h('h1',{id:'step-h', tabindex:'-1'}, def.doneTitle);
    wrap.replaceChildren(h('div',{class:'step stack-l', 'data-screen':'done'}, head, done,
      h('div',{class:'row'},
        h('a',{class:'btn primary big', href:'#/log/e/'+entry.id}, 'Open in Log'),
        h('a',{class:'btn big', href:'#/home'}, 'Back to Home'))));
    window.scrollTo(0,0); head.focus(); announce(def.doneTitle+'.');
  }
  draw(false);
}

function checkpointInit(from){
  const q = from || {};
  return { decision:'', analysis:q.analysis||'', pull:'', patterns:(q.patterns||[]).slice(), unsure:!!q.unsure,
    constraint:{ text:'', verified:'', source:'', step:'' }, rushed:'', cost:{ monthly:'', months:'12', oneOff:'' }, horizon:{ m10:'', mo10:'', y10:'' },
    premortem:'', commitment:q.commitment||'', checks:Object.assign({ chosen:false, overridden:false }, q.checks||{}), followDate:addDays(todayStr(),7), upgradeId:from ? from.id : null };
}
function costText(c){
  const m = parseFloat(c.monthly), n = parseFloat(c.months), o = parseFloat(c.oneOff);
  if(!isFinite(m) || !isFinite(n)) return 'Enter the monthly cost and the number of months to see the total.';
  const total = m*n;
  let t = 'Fast option: '+money(m)+' × '+n+' months = '+money(total)+'.';
  if(isFinite(o)) t += ' One-off option: '+money(o)+'. The fast option costs '+money(Math.abs(total-o))+(total > o ? ' more' : total < o ? ' less' : ', the same')+' over '+n+' months.';
  return t;
}

function linkBtn(href, label, cls, act){ return h('a',{class:'btn '+(cls||''), href, 'data-act':act||null}, label); }

function screenOnboarding(main){
  main.replaceChildren(h('div',{class:'stack-l', 'data-screen':'onboarding'},
    h('h1',null,'Decide, Don\'t Default'),
    h('p',{class:'lead'},'Use this when pressure is about to make you drop a good plan. Bring one real decision, however small. You end with one sentence you commit to; the Log asks later how it went.'),

function resolvePlan(p, result){
  p.outcome = { result, at:iso() }; persist();
  if(result === 'defaulted') startAutopsyFromPlan(p);
  else { announce('Outcome saved: held to my plan.'); route(false); }
}
function outcomeButtons(p){
  return h('div',{class:'row'},
    h('button',{type:'button', class:'btn primary big', 'data-act':'held', onclick:() => resolvePlan(p,'held')}, 'Held to my plan'),
    h('button',{type:'button', class:'btn big', 'data-act':'defaulted', onclick:() => resolvePlan(p,'defaulted')}, 'Defaulted'));
}
function nextBlock(a){
  if(a.kind === 'passed') return h('section',{class:'next stack', 'data-test':'next', 'aria-label':'Next'},
    h('h2',null,'How did it go?'), h('p',{class:'lead'}, a.plan.event+', '+fmtDate(a.plan.date)+', '+a.plan.time+'.'),
    h('p',{class:'hint'},'Your answer is self-reported. "Defaulted" opens an Autopsy filled in from your plan.'), outcomeButtons(a.plan));
  const head = { followup:'Follow-up due', backup:'Back up your data', revisit:'Revisit a pattern' }[a.kind];
  return h('section',{class:'next stack', 'data-test':'next', 'aria-label':'Next'}, h('h2',null,head), h('p',{class:'lead'}, a.kind === 'followup' ? 'Due '+fmtDate(a.entry.followUp.date)+': “'+clean(entryTitle(a.entry))+'”. How did it go?' : a.text), linkBtn(a.hash, a.label, 'primary', 'next-action'));
}
function resumeList(){
  const rows = [];
  [['quick','Quick Checkpoint'],['checkpoint','Checkpoint'],['prepare','Prepare'],['autopsy','Autopsy']].forEach(([k,n]) => {
    const d = state.drafts[k]; if(!d) return;

  });
  const dd = state.drafts.drill;
  if(dd && dd.step < 4) rows.push(h('li',null, h('a',{class:'entry-link', href:dd.mode === 'placement' ? '#/train/placement' : '#/train/drill', 'data-act':'resume-drill'}, h('span',{class:'title'}, 'Resume '+(dd.mode === 'placement' ? 'placement' : 'drill')), h('span',{class:'meta'}, ' · step '+(dd.step+1)+' of 4, started '+fmtStamp(dd.startedAt||dd.at)))));

/* ---- Log ---- */
function criteria(e){
  const rows = [];
  if(e.type === 'quick' || e.type === 'checkpoint'){
    const n = words(e.commitment);
    rows.push({ kind:'sys', ok:n > 0 && n < 20, text:'Commitment sentence: '+n+' words. Criterion: under 20 words.' });
    CHECKS.commit.forEach(c => rows.push({ kind:'self', ok:!!(e.checks && e.checks[c.k]), text:c.t+'.' }));
  }
  if(e.type === 'checkpoint') rows.push({ kind:'self', ok:e.constraint.verified !== 'no', text:'Assumed constraint verified at source: '+({ yes:'yes', no:'no', none:'none assumed' }[e.constraint.verified])+'.' });
  const planRow = (p,label) => { const t = CHECKS.ifthen.filter(c => p.checks && p.checks[c.k]).length; return { kind:'self', ok:t === 3, text:label+': '+t+' of 3 if-then checklist items ticked.' }; };
  if(e.type === 'prepare') e.plans.forEach((p,i) => rows.push(planRow(p, ORD[i])));
  if(e.type === 'autopsy'){ rows.push({ kind:'self', ok:!e.unsure, text:'Named the pattern: '+nameList(e.patterns)+'.' }); rows.push(planRow(e.plan,'Plan for next time')); }
  return rows;
}
function criteriaList(e){
  return h('div',{class:'stack'}, criteria(e).map(r => r.kind === 'sys'
    ? h('div',{class:'check sys'}, h('span',{class:'icon','aria-hidden':'true'}, r.ok ? '✓' : '✗'), h('div',{class:'txt'}, h('strong',null, r.ok ? 'Pass. ' : 'Not yet. '), r.text, ' ', h('span',{class:'tag sys'},'Scored by the app')))
    : h('div',{class:'check self', style:'cursor:default'}, h('span',{class:'icon','aria-hidden':'true'}, r.ok ? '☑' : '☐'), h('div',{class:'txt'}, h('strong',null, r.ok ? 'Ticked. ' : 'Not ticked. '), r.text, ' ', h('span',{class:'tag self'},'Self-reported')))));
}
function followText(e){
  if(e.type === 'prepare') return e.outcome ? 'Outcome: '+(e.outcome.result === 'held' ? 'held to my plan' : 'defaulted')+' (self-reported)' : (eventAt(e) <= now() ? 'Outcome not recorded' : 'Event '+fmtDate(e.date)+', '+e.time);
  if(!e.followUp) return '';
  if(e.followUp.outcome) return 'Outcome recorded (self-reported)';
